<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLAYER ONE｜音樂工作室試玩版</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#302444,#0c101b 65%);color:#f9f3ec;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;min-height:100dvh}header{padding:22px 18px 10px;text-align:center}small,.muted{color:#bbb2c6}h1{font-size:24px;margin:6px}h2{font-size:21px;margin:6px 0 14px}.wrap{max-width:670px;margin:auto;padding:12px 16px 90px}.panel{background:#201d30;border:1px solid #655778;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 28px #0004}button{font:inherit;border:1px solid #8476aa;border-radius:13px;background:#4f3f76;color:white;padding:12px 15px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}button.primary{background:#7960cc;border-color:#a590ec;font-weight:700}button.ghost{background:#2c293d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:126px;text-align:left;padding:16px;display:flex;flex-direction:column;gap:9px;justify-content:center}.emoji{font-size:32px}.title{font-weight:700}.sub{font-size:12px;color:#cfc6dd}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.hide{display:none!important}.stat{display:inline-block;background:#343047;padding:7px 10px;border-radius:10px;margin:4px 4px 4px 0;font-size:13px}input[type=range]{width:100%;accent-color:#b19af8}label{display:block;margin:12px 0}.meter{height:12px;background:#423951;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#a76bc7,#74c7a6);width:0%}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slots button{padding:16px 2px;font-size:24px}.good{color:#91e3b9}.bad{color:#ffb0ac}.record{border:1px solid #7d6c9e;border-radius:15px;padding:13px;margin:8px 0}.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:310px;position:relative;margin:12px 0}.lane{position:relative;background:linear-gradient(#26233a,#3b2c55);border-radius:10px;overflow:hidden;border:1px solid #6c5b86}.hitline{position:absolute;bottom:55px;height:3px;background:#ffe9ad;left:0;right:0;box-shadow:0 0 12px #f9d98d}.note{position:absolute;left:12%;width:76%;height:22px;border-radius:8px;background:#a5e3ff;box-shadow:0 0 12px #9ac8ff;top:0}.key{position:absolute;bottom:6px;left:7%;width:86%;height:42px;padding:6px;background:#7960cc;z-index:2}.flash{background:#66ad9c!important}.status{min-height:40px;font-weight:700}.tag{font-size:12px;background:#453b5d;border-radius:30px;padding:4px 9px}.foot{color:#aaa0b6;text-align:center;font-size:12px;margin:30px 0} </style></head><body><header><small>PLAYER ONE · MUSIC WORLD</small><h1>🎼 PRIVATE MUSIC STUDIO</h1><small>五個小遊戲・可實際試玩・不需上傳音檔</small></header><div class="wrap"><section id="home"><div class="panel"><h2>🎧 私人音樂工作室</h2><p class="muted">點選工作室物件進入不同挑戰。這是玩法原型，不是最終美術版本。</p><div class="grid"><button class="tile" onclick="go('rhythm')"><span class="emoji">💿</span><span class="title">節奏舞台</span><span class="sub">選歌／四軌音符</span></button><button class="tile" onclick="go('mix')"><span class="emoji">🎚️</span><span class="title">錄音工作室</span><span class="sub">聽音辨錯／混音</span></button><button class="tile" onclick="go('vinyl')"><span class="emoji">📀</span><span class="title">唱片收藏室</span><span class="sub">聽旋律／重排順序</span></button><button class="tile" onclick="go('final')"><span class="emoji">🎙️</span><span class="title">最終錄音</span><span class="sub">設備／聽力／節奏 Boss</span></button><button class="tile" onclick="go('secret')"><span class="emoji">📻</span><span class="title">秘密點唱機</span><span class="sub">隱藏歌曲線索</span></button></div></div><div class="panel"><h2>🏆 音樂世界進度</h2><div id="progress"></div><button class="ghost" onclick="if(confirm('確定清除本機試玩紀錄？')){localStorage.removeItem('studio-demo-v1');location.reload()}">重置試玩紀錄</button></div></section><section id="game" class="hide"><button class="ghost" onclick="go('home')">← 返回工作室</button><div id="content"></div></section><p class="foot">純前端試玩 · 本版音效由瀏覽器合成 · 建議先開啟手機聲音</p></div><script>
const $=id=>document.getElementById(id);let ctx,active='home',timer=null,raf=null;const state=JSON.parse(localStorage.getItem('studio-demo-v1')||'{}');function save(k){state[k]=true;localStorage.setItem('studio-demo-v1',JSON.stringify(state));progress()}function progress(){let names=[['rhythm','節奏舞台'],['mix','錄音工作室'],['vinyl','唱片收藏室'],['final','最終錄音'],['secret','秘密點唱機']];$('progress').innerHTML=names.map(([k,n])=>`<span class="stat">${state[k]?'✅':'▫️'} ${n}</span>`).join('')}function audio(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}}function tone(freq=440,dur=.18,type='sine',vol=.1,delay=0){audio();if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.03)}function melody(notes){notes.forEach((f,i)=>tone(f,.23,'sine',.13,i*.32))}function clear(){if(timer)clearInterval(timer);timer=null;if(raf)cancelAnimationFrame(raf);raf=null}function go(k){clear();active=k;$('home').classList.toggle('hide',k!=='home');$('game').classList.toggle('hide',k==='home');if(k==='home'){progress();return}({rhythm:rhythm,mix:mix,vinyl:vinyl,final:finalGame,secret:secret})[k]();window.scrollTo(0,0)}function complete(k,msg){save(k);let el=$('feedback');if(el)el.innerHTML='<span class="good">🎉 '+msg+'</span>'}
function mix(){let target=[65,35,70,45];$('content').innerHTML=`<div class="panel"><h2>🎚️ RECORDING LAB</h2><p>混音台被打亂了！先聽「標準版本」，再調整四個音軌。四條音軌都在正確音量 ±10 以內就能過關。</p><button onclick="mixHear(true)">▶ 聽標準混音</button> <button class="ghost" onclick="mixHear(false)">▶ 聽目前混音</button><div id="sliders"></div><button class="primary" onclick="checkMix()">完成母帶／檢查混音</button><p id="feedback" class="status"></p></div>`;$('sliders').innerHTML=['主唱','鼓組','貝斯','旋律'].map((n,i)=>`<label>${n} <b id="v${i}">50</b>%<input type="range" min="0" max="100" step="5" value="50" id="s${i}" oninput="$('v${i}').textContent=this.value"></label>`).join('')}function mixHear(ref){let v=ref?[65,35,70,45]:[0,1,2,3].map(i=>+$('s'+i).value);[440,165,220,660].forEach((f,i)=>tone(f,.42,'sine',.018+v[i]/850,i*.1))}function checkMix(){let t=[65,35,70,45],v=t.map((_,i)=>+$('s'+i).value),err=v.map((n,i)=>Math.abs(n-t[i]));if(err.every(n=>n<=10))complete('mix','混音修復成功！獲得試玩卡包');else $('feedback').innerHTML='還需要調整：'+err.map((e,i)=>e>10?['主唱','鼓組','貝斯','旋律'][i]:'').filter(Boolean).join('、')}
let vinOrder=[];const vinFreq=[392,523,440,659];function vinyl(){vinOrder=[];$('content').innerHTML=`<div class="panel"><h2>📀 VINYL ARCHIVE</h2><p>收藏室有四張散落的唱片。先聽「原始旋律」，再依照聽到的高低順序點選唱片 A–D。</p><button onclick="melody([392,523,440,659])">▶ 播放原始旋律</button><div class="slots" style="margin-top:18px">${['A','B','C','D'].map((n,i)=>`<button onclick="tone(${vinFreq[i]});addVin(${i})">💿<br><small>${n}</small></button>`).join('')}</div><p>你的順序：<strong id="order">尚未選擇</strong></p><button class="ghost" onclick="vinOrder=[];$('order').textContent='尚未選擇'">清除</button> <button class="primary" onclick="checkVin()">確認排序</button><p id="feedback" class="status"></p><small>提示：四張唱片的音符各不相同，聽完原始旋律再點按對照。</small></div>`}function addVin(i){if(!vinOrder.includes(i)&&vinOrder.length<4)vinOrder.push(i);$('order').textContent=vinOrder.map(i=>'ABCD'[i]).join(' → ')}function checkVin(){if(vinOrder.length!==4){$('feedback').textContent='請先選滿四張唱片';return}if(vinOrder.join(',')==='0,1,2,3')complete('vinyl','唱片順序正確！獲得最終錄音線索');else $('feedback').textContent='順序不對，再聽一次原始旋律吧'}
let secretStep=0;function secret(){secretStep=0;$('content').innerHTML=`<div class="panel"><h2>📻 SECRET JUKEBOX</h2><p>秘密點唱機需要三個線索。根據歌名意象，依序選出：<b>天空 → 缺口 → 小薇</b>。</p><div class="grid">${[['🌊','海闊天空'],['🕳️','缺口'],['🌸','小薇'],['⭐','星空']].map(([e,n])=>`<button onclick="secretPick('${n}')">${e}<br>${n}</button>`).join('')}</div><p>已輸入：<span id="secretProgress">0 / 3</span></p><p id="feedback" class="status"></p><button class="ghost" onclick="secretStep=0;$('secretProgress').textContent='0 / 3'">重新輸入</button></div>`}function secretPick(n){let seq=['海闊天空','缺口','小薇'];if(n===seq[secretStep]){tone(440+secretStep*130);secretStep++;$('secretProgress').textContent=secretStep+' / 3';if(secretStep===3)complete('secret','秘密歌單解鎖！獲得隱藏試玩卡包')}else{tone(160,.24,'sawtooth',.04);secretStep=0;$('secretProgress').textContent='0 / 3';$('feedback').textContent='順序錯誤，請重新開始'}}
let finalStep=0;function finalGame(){finalStep=0;finalRender()}function finalRender(){let html=finalStep===0?`<p>第一階段：依照錄音流程，先接上哪個設備？</p><button onclick="finalAnswer(0)">🎤 麥克風 → 混音台 → 耳機</button><p><button onclick="finalAnswer(-1)">🔊 音響 → 耳機 → 麥克風</button></p>`:finalStep===1?`<p>第二階段：聆聽兩段音符，找出「先低後高」的旋律。</p><button onclick="melody([330,660])">▶ A 旋律</button> <button onclick="melody([660,330])">▶ B 旋律</button><p><button onclick="finalAnswer(1)">選 A</button> <button onclick="finalAnswer(-1)">選 B</button></p>`:`<p>第三階段：跟著提示，依序點擊四拍 <b>1 → 2 → 3 → 4</b>。</p><div class="slots">${[1,2,3,4].map(i=>`<button onclick="finalBeat(${i})">${i}</button>`).join('')}</div><p>目前進度：<span id="beatCount">0 / 4</span></p>`;$('content').innerHTML=`<div class="panel"><h2>🎙️ FINAL SESSION</h2><span class="tag">階段 ${finalStep+1} / 3</span>${html}<p id="feedback" class="status"></p></div>`}function finalAnswer(v){if(v===finalStep){tone(660);finalStep++;finalRender()}else{$('feedback').textContent='不太對，再試一次';tone(180,.2,'sawtooth',.04)}}let beat=0;function finalBeat(i){if(i===beat+1){tone(300+i*120);beat++;$('beatCount').textContent=beat+' / 4';if(beat===4){complete('final','FINAL SESSION 完成！獲得音樂核心＋試玩卡包');beat=0}}else{beat=0;$('beatCount').textContent='0 / 4';$('feedback').textContent='節拍順序錯誤，重新開始'}}
let rnotes=[],rstart=0,rcombo=0,rscore=0,rhit=0,rmiss=0,rplaying=false;function rhythm(){$('content').innerHTML=`<div class="panel"><h2>💿 RHYTHM STAGE</h2><p>選歌：<b>光陰副本｜節奏操作試玩</b></p><p class="muted">本版以合成節拍示範四軌玩法，不含商業歌曲音檔；正式版保留原曲與對應譜面。</p><div class="row"><span class="stat">分數 <b id="rs">0</b></span><span class="stat">COMBO <b id="rc">0</b></span><span class="stat">MISS <b id="rm">0</b></span></div><div class="lanes">${[0,1,2,3].map(i=>`<div class="lane" id="lane${i}"><div class="hitline"></div><button class="key" id="key${i}" onclick="hit(${i})">${['D','F','J','K'][i]}</button></div>`).join('')}</div><div id="feedback" class="status">按開始後 3、2、1、GO！</div><button class="primary" onclick="startRhythm()">▶ 開始／重新挑戰</button><p class="muted">判定線在按鍵上方；音符到達時點擊。空按不扣分，漏掉音符顯示 MISS。</p></div>`}function startRhythm(){clear();audio();rnotes=[];rcombo=rscore=rhit=rmiss=0;rplaying=false;['rs','rc','rm'].forEach(id=>$(id).textContent='0');for(let i=0;i<4;i++)$('lane'+i).querySelectorAll('.note').forEach(e=>e.remove());let c=3;$('feedback').textContent='3';tone(440,.12);timer=setInterval(()=>{c--;if(c>0){$('feedback').textContent=c;tone(440,.12)}else{clearInterval(timer);timer=null;$('feedback').textContent='GO!';tone(880,.28);setTimeout(()=>{if(active==='rhythm')runRhythm()},380)}},1000)}function runRhythm(){rplaying=true;rstart=performance.now();rnotes=Array.from({length:28},(_,i)=>({lane:(i*7+Math.floor(i/3))%4,t:1300+i*430,done:false}));raf=requestAnimationFrame(tickRhythm)}function tickRhythm(){if(!rplaying||active!=='rhythm')return;let now=performance.now()-rstart;for(let n of rnotes){if(n.done)continue;if(now>n.t+180){n.done=true;rmiss++;rcombo=0;$('feedback').textContent='MISS';$('rm').textContent=rmiss;$('rc').textContent=0;continue}if(now>=n.t-1350){let lane=$('lane'+n.lane),el=n.el;if(!el){el=document.createElement('div');el.className='note';lane.appendChild(el);n.el=el}el.style.top=(Math.max(0,Math.min(1,(now-(n.t-1350))/1350))* (lane.clientHeight-88))+'px'}}if(now>14000){rplaying=false;let accuracy=Math.round(rhit/28*100),bonus=accuracy>=95?1.3:accuracy>=90?1.2:accuracy>=80?1.12:accuracy>=70?1.06:1,score=Math.round(rscore*bonus),grade=score>=35000?'S':score>=26000?'A':score>=18000?'B':score>=9000?'C':'D';$('feedback').innerHTML=`結算：${score} 分｜命中 ${rhit}/28｜${grade} 級`;if(rhit>=17)save('rhythm');return}raf=requestAnimationFrame(tickRhythm)}function hit(lane){if(!rplaying)return;let now=performance.now()-rstart,n=rnotes.filter(n=>!n.done&&n.lane===lane).sort((a,b)=>Math.abs(now-a.t)-Math.abs(now-b.t))[0];if(!n||Math.abs(now-n.t)>170)return;n.done=true;n.el?.remove();rhit++;rcombo++;let d=Math.abs(now-n.t),v=d<65?1000:d<110?700:400;rscore+=Math.round(v*(1+(rcombo-1)*.012));$('rs').textContent=rscore;$('rc').textContent=rcombo;$('feedback').textContent=d<65?'PERFECT!':d<110?'GREAT!':'GOOD!';tone(500+lane*120,.09,'triangle',.045);let key=$('key'+lane);key.classList.add('flash');setTimeout(()=>key.classList.remove('flash'),110)}progress();</script></body></html>
