function bloomStage(){head(5,'BLOOM RUSH','極限悶蒸','26 秒內完成 40g 悶蒸注水。右側直向滑桿控制流速；紅燈亮起時立刻把滑桿拉到最底部；每次停止都有預警。');$('#body').innerHTML=`<div class="metrics"><div class="metric"><b id="time">26.0s</b><small>剩餘時間</small></div><div class="metric"><b id="water">0.0g</b><small>有效注水</small></div><div class="metric"><b id="stops">0/2</b><small>STOP 成功</small></div></div><div class="pourLayout"><div class="scene pourVisual">${pourSVG}<div id="pourCue" style="position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-weight:900;letter-spacing:2px;color:#e9d5b8">READY · DRAG THE SLIDER</div></div><div class="flowControl" id="flowSlider"><div class="flowLabel" style="top:9px">FAST</div><div class="flowLabel" style="top:48%">MID</div><div class="flowLabel" style="bottom:9px">STOP</div><div class="flowThumb" id="thumb"></div></div></div><div class="metrics"><div class="metric"><b id="flow">0.0</b><small>流速 g/s</small></div><div class="metric"><b id="spill">0.0g</b><small>濺水</small></div></div><div class="message" id="msg">拖動右側控制條開始計時。流速越大越快，但也越容易濺出。</div><div class="actions" id="bloomActions"><button class="btn secondary" id="bloomRetry">重新挑戰</button></div>`;$('#bloomRetry').onclick=render;let setting=0,actual=0,water=0,spill=0,remaining=26,stopIndex=0,stopSuccess=0,stopUntil=0,active=false,finished=false,last=0,raf=0,red=false,waitTimer=0;const slider=$('#flowSlider');function set(v){setting=clamp(v,0,1);$('#thumb').style.bottom=`calc(${setting*100}% - ${setting*17}px)`}function input(e){e.preventDefault();const r=slider.getBoundingClientRect();set(1-(e.clientY-r.top)/r.height);if(!active&&!finished){active=true;last=performance.now();raf=requestAnimationFrame(tick)}}slider.addEventListener('pointerdown',e=>{slider.setPointerCapture(e.pointerId);input(e)});slider.addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0)input(e)});function finish(pass){if(finished)return;finished=true;active=false;cancelAnimationFrame(raf);let ok=pass&&water>=38&&water<=42&&stopSuccess>=1&&remaining>0;score.bloom=ok?Math.round(clamp(100-Math.abs(water-40)*10-spill*3-(2-stopSuccess)*9,50,100)):0;msg(ok?`悶蒸注水完成 ${water.toFixed(1)}g。咖啡粉正在排氣，等待至 0:35。`:`挑戰失敗：${water.toFixed(1)}g，請再試一次。`);$('#pourCue').textContent=ok?'BLOOMING · 0:35':'TRY AGAIN';if(ok){waitTimer=setTimeout(()=>$('#bloomActions').append(action('開始正式注水 →',next)),1300)}}function tick(t){if(!active)return;let dt=Math.min(.06,(t-last)/1000);last=t;remaining-=dt;let elapsed=26-remaining;if(stopIndex<2&&elapsed>=[7.5,16.0][stopIndex]){stopIndex++;red=true;stopUntil=elapsed+1.8;$('#pourCue').textContent='● STOP! · 收水';$('#pourCue').style.color='#ffb0a0'}if(red){if(setting<.09){red=false;stopSuccess++;$('#pourCue').textContent='GOOD · CONTINUE';$('#pourCue').style.color='#cbe4b3'}else if(elapsed>=stopUntil){red=false;$('#pourCue').textContent='MISSED · CONTINUE';$('#pourCue').style.color='#e9d5b8'}}let desired=setting<.045?0:Math.pow(setting,1.12)*4.0;actual+=(desired-actual)*Math.min(1,dt*5);let lost=actual*dt*Math.max(0,setting-.80)*.25;water+=actual*dt-lost;spill+=lost;$('#waterStream').setAttribute('opacity',Math.min(1,actual/1.7));$('#waterStream').setAttribute('stroke-width',1.5+actual*.85);$('#bubbles').setAttribute('opacity',Math.min(1,.3+water/45));$('#time').textContent=Math.max(0,remaining).toFixed(1)+'s';$('#water').textContent=water.toFixed(1)+'g';$('#stops').textContent=stopSuccess+'/2';$('#flow').textContent=actual.toFixed(1);$('#spill').textContent=spill.toFixed(1)+'g';$('#bloomScale').textContent=water.toFixed(1)+'g';if(water>42.4||remaining<=0){finish(false);return}if(water>=38&&setting<.09&&actual<.25){finish(true);return}raf=requestAnimationFrame(tick)}cleanup=()=>{cancelAnimationFrame(raf);clearTimeout(waitTimer)}}
function spiralStage(){head(6,'GOLDEN SPIRAL','黃金螺旋注水','記住金色示範路線。接著移動壺嘴，用水流從粉床中央向外繞圈注水。相似度達 72% 才能通關。');$('#body').innerHTML=`<div class="scene" id="spiralScene" style="height:360px;position:relative"><canvas class="spiralCanvas" id="spiral"></canvas><div class="spiralHud"><span>V60 · POUR OVER</span><span id="pourWeight">40 / ${recipe.water} g</span></div><div id="nozzle" style="position:absolute;z-index:4;pointer-events:none;display:none;width:67px;height:58px;transform:translate(-15px,-32px)"><svg viewBox="0 0 90 70" width="90" height="70"><defs><linearGradient id="nozzleMetal"><stop stop-color="#f7e8d5"/><stop offset=".45" stop-color="#706f69"/><stop offset="1" stop-color="#c5b9a8"/></linearGradient></defs><path d="M90 0 Q61 7 54 22 L39 44 Q32 54 10 57" fill="none" stroke="#302a27" stroke-width="17" stroke-linecap="round"/><path d="M90 0 Q61 7 54 22 L39 44 Q32 54 10 57" fill="none" stroke="url(#nozzleMetal)" stroke-width="12" stroke-linecap="round"/><ellipse cx="10" cy="57" rx="7" ry="4" fill="#b6dce5"/></svg><div class="brewStream" id="spiralStream" style="display:block;left:6px;top:56px;height:20px"></div></div></div><div class="message" id="msg">先記住示範的注水軌跡，2.5 秒後開始。</div><div class="metrics"><div class="metric"><b id="similar">—</b><small>軌跡相似度</small></div><div class="metric"><b id="cover">—</b><small>路線覆蓋率</small></div></div><div class="actions" id="spiralActions"><button class="btn secondary" id="spiralRetry">重新挑戰</button></div>`;$('#spiralRetry').onclick=render;const canvas=$('#spiral'),r=canvas.getBoundingClientRect(),w=r.width,h=r.height,dpr=Math.min(devicePixelRatio||1,2.5);canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const cx=w/2,cy=h/2,R=Math.min(w,h)*.29;const nozzle=$('#nozzle');function goalPoints(){return Array.from({length:280},(_,i)=>{let t=i/279,a=t*Math.PI*4.0-Math.PI/2,rad=5+t*R;return [cx+Math.cos(a)*rad,cy+Math.sin(a)*rad]})}const goal=goalPoints();let points=[],drawing=false,ready=false,done=false;function drawPath(a,color,width=5){if(a.length<2)return;ctx.beginPath();ctx.moveTo(...a[0]);for(let i=1;i<a.length;i++)ctx.lineTo(...a[i]);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}function base(){ctx.clearRect(0,0,w,h);let bg=ctx.createRadialGradient(cx-25,cy-25,4,cx,cy,R*1.35);bg.addColorStop(0,'#a5764d');bg.addColorStop(.53,'#674125');bg.addColorStop(.95,'#332216');bg.addColorStop(1,'#20140f');ctx.fillStyle='#3e2a1d';ctx.fillRect(0,0,w,h);ctx.save();ctx.shadowColor='#0009';ctx.shadowBlur=24;ctx.shadowOffsetY=9;ctx.fillStyle='#eadac5';ctx.beginPath();ctx.ellipse(cx,cy,R*1.27,R*1.27,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#f1e1c8';ctx.beginPath();ctx.arc(cx,cy,R*1.18,0,Math.PI*2);ctx.fill();ctx.fillStyle=bg;ctx.beginPath();ctx.arc(cx,cy,R*1.07,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a17a56';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,R*1.07,0,Math.PI*2);ctx.stroke();for(let i=0;i<150;i++){let a=i*2.3999,rad=Math.sqrt(i/150)*R*.98,x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;ctx.fillStyle=i%4?'#a77b4b44':'#e0b68b2b';ctx.beginPath();ctx.arc(x,y,1.1+i%3*.3,0,Math.PI*2);ctx.fill()}}function update(){base();if(done){drawPath(goal,'#f0bb66',7);drawPath(points,'#c8e9f3',6)}else if(ready){drawPath(points,'#c8e9f3aa',12);drawPath(points,'#e6faff',3)}else drawPath(goal,'#f0c783',6)}function pointer(e){const b=canvas.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}function nozzleAt(pt){nozzle.style.display='block';nozzle.style.left=pt[0]+'px';nozzle.style.top=pt[1]+'px'}update();let timer=setTimeout(()=>{ready=true;update();msg('現在開始！用壺嘴畫出水流螺旋，從中心向外擴展。')},2500);canvas.addEventListener('pointerdown',e=>{if(!ready||done)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;points=[pointer(e)];nozzleAt(points[0]);update()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pointer(e);if(Math.hypot(p[0]-points[points.length-1][0],p[1]-points[points.length-1][1])>1.4)points.push(p);nozzleAt(p);$('#pourWeight').textContent=(40+Math.min(187,points.length*.65)).toFixed(0)+' / '+recipe.water+' g';update()});canvas.addEventListener('pointerup',()=>{if(!drawing)return;drawing=false;done=true;nozzle.style.display='none';if(points.length<10){done=false;points=[];update();msg('水流太短，請從粉床中央重新開始。');return}let samples=[];for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/3));for(let j=0;j<n;j++){let t=j/n;samples.push([a[0]*(1-t)+b[0]*t,a[1]*(1-t)+b[1]*t])}}samples.push(points[points.length-1]);const tolerance=Math.max(19,w*.062);const minDist=(p,arr)=>{let min=1e9;for(const q of arr){const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<min)min=d}return Math.sqrt(min)};const precision=samples.filter(p=>minDist(p,goal)<=tolerance).length/samples.length;const coverage=goal.filter(p=>minDist(p,samples)<=tolerance).length/goal.length;const startScore=clamp(1-Math.hypot(points[0][0]-cx,points[0][1]-cy)/(R*.50),0,1);const endScore=clamp(1-Math.abs(Math.hypot(points.at(-1)[0]-cx,points.at(-1)[1]-cy)-R)/(R*.5),0,1);const similarity=Math.round(clamp((precision*.43+coverage*.43+startScore*.09+endScore*.05)*100,0,100));score.spiral=similarity;update();$('#similar').textContent=similarity+'%';$('#cover').textContent=Math.round(coverage*100)+'%';if(similarity>=72){$('#pourWeight').textContent=recipe.water+' / '+recipe.water+' g';msg(`相似度 ${similarity}% · 通關！金色是標準注水路線，藍色是你的水流。`);$('#spiralActions').append(action('完成萃取 →',next))}else{msg(`相似度 ${similarity}% · 尚未達到 72% 通關標準。金色與藍色的重疊區越多，分數越高。`);$('#spiralActions').append(action('再試一次',render))}});cleanup=()=>clearTimeout(timer)}
function finalStage(){const entries=[['神秘配方',score.recipe],['盲秤挑戰',score.weigh],['限時磨豆',score.grind],['沖煮工作檯',score.station],['極限悶蒸',score.bloom],['黃金螺旋',score.spiral]];let total=Math.round(entries.reduce((s,x)=>s+(x[1]||0),0)/entries.length);head(7,'FINAL CUP','這杯咖啡，完成了。','咖啡慢慢滴落，香氣升起。每一個動作都成為這杯咖啡的故事。');$('#body').innerHTML=`<div class="scene" style="height:290px"><svg viewBox="0 0 360 290"><defs><radialGradient id="finalCoffee"><stop stop-color="#a97645"/><stop offset=".7" stop-color="#51301d"/><stop offset="1" stop-color="#20130e"/></radialGradient></defs><ellipse cx="181" cy="240" rx="115" ry="25" fill="#1b100a" opacity=".5"/><path d="M76 99 L268 99 L246 221 Q178 262 100 221Z" fill="#e7d6ba" stroke="#b58d63" stroke-width="7"/><ellipse cx="173" cy="100" rx="97" ry="30" fill="#f4e5cf" stroke="#b58e6b" stroke-width="5"/><ellipse cx="173" cy="101" rx="79" ry="22" fill="url(#finalCoffee)"/><path d="M268 127 Q330 102 312 169 Q301 194 260 182" fill="none" stroke="#d7c2a1" stroke-width="16"/><g fill="none" stroke="#f5e4ce" opacity=".6" stroke-width="3"><path d="M126 70 Q105 49 129 31 Q145 16 128 2"/><path d="M181 69 Q160 45 183 27 Q197 12 184 1"/><path d="M223 70 Q208 52 225 34 Q241 16 227 3"/></g></svg><div style="position:absolute;bottom:13px;text-align:center;width:100%;font-size:11px;letter-spacing:3px;color:#e8d3b2">BREW COMPLETE</div></div><div class="panel" style="text-align:center;margin-top:17px"><div class="eyebrow">YOUR BREW SCORE</div><div style="font:70px Georgia,serif;color:#f3d3a0">${total}<span style="font-size:18px"> / 100</span></div><div style="letter-spacing:3px;color:#d8b78a">${rating(total)}</div></div><div class="panel" style="margin-top:13px">${entries.map(x=>`<div class="scoreLine"><span>${x[0]}</span><b>${x[1]??'—'}</b></div>`).join('')}<p class="hintText">分數代表遊戲操作表現，並非真實咖啡的杯測結果。</p></div><div class="actions" id="finalActions"></div>`;$('#progress').style.width='100%';$('#finalActions').append(action('重新沖煮一杯',()=>{step=0;score={};guess='';history=[];hints=0;render()}))}render();
</script></body></html>
