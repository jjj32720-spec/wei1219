<div class="status"><div class="num" id="stepNum">01</div><div><strong id="taskTitle">濾紙準備</strong><p id="taskText">拖動濾紙，放進中央的 V60 濾杯。</p></div></div><div class="progress"><div id="progressBar"></div></div><div class="actions"><button class="btn" id="reset">重新開始</button><button class="btn motion" id="motion">啟用手機體感</button><button class="btn" id="shake" style="display:none">左右輕晃濾杯</button><button class="btn primary" id="next" disabled>下一階段 →</button></div><div class="complete" id="complete"><h2>BREW READY.</h2><p>濾紙已預濕、廢水已倒掉，咖啡粉均勻平整，電子秤歸零。你的工作檯已準備好迎接悶蒸注水。</p></div><div class="hint">拖曳器具到正確位置 · 只有正確的順序才會觸發連續動畫。這是第四關獨立品質測試版，未覆蓋原生日遊戲。</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),scene=$('scene'),wrap=$('wrap');let stage=0,locked=false,drag=null,shakeCount=0,motionReady=false,prevAccel=0;const steps=[['濾紙準備','拖動濾紙，放進中央的 V60 濾杯。'],['預濕濾紙','把熱水壺移到濾杯上方，預濕濾紙並預熱器具。'],['倒掉預濕水','拖動分享壺區域，把預濕水倒進右下角的廢水碗。'],['放回分享壺','將分享壺放回電子秤，準備加入咖啡粉。'],['倒入咖啡粉','將粉杯移至濾杯上方，倒入研磨好的咖啡粉。'],['整平粉床','輕輕左右晃動手機，或使用備用按鈕整平粉床。'],['電子秤歸零','點擊電子秤右側的圓形按鍵，讓讀數歸零。']];const home={filter:{x:93,y:125},kettle:{x:350,y:113},cup:{x:101,y:270},server:{x:229,y:230}};let positions={filter:{x:0,y:0},kettle:{x:0,y:0},cup:{x:0,y:0},server:{x:0,y:0}};const movable={filter:'filterItem',kettle:'kettleItem',cup:'cupItem'};function notify(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.remove('show'),1500)}function render(){let i=Math.min(stage,6);$('stepNum').textContent=String(i+1).padStart(2,'0');$('stageLabel').textContent=String(i+1).padStart(2,'0')+' / 07';$('taskTitle').textContent=stage>=7?'沖煮準備完成':steps[i][0];$('taskText').textContent=stage>=7?'接下來可以開始極限悶蒸。':steps[i][1];$('progressBar').style.width=(stage/7*100)+'%';$('next').disabled=stage!==7;$('complete').classList.toggle('show',stage===7);$('shake').style.display=stage===5?'inline-block':'none';$('motion').classList.toggle('show',stage===5&&typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'&&!motionReady);$('dropGlow').classList.toggle('on',[0,1,4].includes(stage));$('wasteGlow').classList.toggle('on',stage===2)}function advance(){stage++;render();if(stage===7)notify('工作檯準備完成 ✓')}
function coords(e){const p=scene.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(scene.getScreenCTM().inverse());return{x:q.x,y:q.y}}function transform(kind){if(kind==='server')return;$(movable[kind]).setAttribute('transform',`translate(${positions[kind].x} ${positions[kind].y})`)}function animate(ms,fn){locked=true;fn();setTimeout(()=>{locked=false;advance()},ms)}function returnHome(kind){positions[kind]={x:0,y:0};$(movable[kind])?.classList.remove('dragging');transform(kind)}function setOpacity(id,value){$(id).style.opacity=value}
function begin(e){if(locked||stage>=7)return;let el=e.target.closest('.item'),kind=el?.dataset.kind;const p=coords(e);if(!kind&&stage===2&&p.x>165&&p.x<310&&p.y>165&&p.y<315){kind='server';el=$('server')}if(!kind)return;const expected={0:'filter',1:'kettle',2:'server',3:'server',4:'cup'}[stage];if(kind!==expected){notify('先完成目前的沖煮步驟');return}e.preventDefault();const old=positions[kind]||{x:0,y:0};drag={kind,id:e.pointerId,start:p,base:{...old},moved:false};el.classList.add('dragging');try{scene.setPointerCapture(e.pointerId)}catch(_){} }function move(e){if(!drag||drag.id!==e.pointerId)return;e.preventDefault();const p=coords(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;const k=drag.kind;if(k==='server'){$('server').setAttribute('transform',`translate(${dx} ${dy}) rotate(${Math.max(-25,Math.min(25,dx/4))} 229 230)`)}else{positions[k]={x:drag.base.x+dx,y:drag.base.y+dy};transform(k)}}function finish(e){if(!drag||drag.id!==e.pointerId)return;const k=drag.kind,p=coords(e),s=stage;drag=null;Object.values(movable).forEach(id=>$(id).classList.remove('dragging'));let ok=false;if(s===0||s===1||s===4)ok=Math.hypot(p.x-229,p.y-160)<100;else if(s===2)ok=Math.hypot(p.x-350,p.y-420)<110;else if(s===3)ok=Math.hypot(p.x-229,p.y-245)<120;if(!ok){if(k==='server')$('server').removeAttribute('transform');else returnHome(k);notify('試著放到正確的位置');return}if(s===0){animate(500,()=>{returnHome(k);$('filterItem').style.opacity='0';setOpacity('filterIn',1);notify('濾紙貼合濾杯')})}else if(s===1){animate(1300,()=>{returnHome(k);$('waterStream').classList.add('active');$('splash').classList.add('active');setOpacity('filterWet',.72);$('scaleValue').textContent='34.8';setOpacity('rinseWater',.65);setTimeout(()=>{$('waterStream').classList.remove('active');$('splash').classList.remove('active')},1000)})}else if(s===2){animate(1000,()=>{setOpacity('rinseWater',0);setOpacity('wasteWater',.5);$('scaleValue').textContent='0.0';setTimeout(()=>$('server').removeAttribute('transform'),700)})}else if(s===3){animate(600,()=>{$('server').removeAttribute('transform');notify('分享壺已放回電子秤')})}else if(s===4){animate(1150,()=>{returnHome(k);$('coffeeStream').classList.add('active');setTimeout(()=>{setOpacity('groundsIn',1);setOpacity('cupCoffee',.12);$('scaleValue').textContent='14.0'},300);setTimeout(()=>$('coffeeStream').classList.remove('active'),950)})}}
scene.addEventListener('pointerdown',begin);scene.addEventListener('pointermove',move);scene.addEventListener('pointerup',finish);scene.addEventListener('pointercancel',()=>{if(drag){if(drag.kind==='server')$('server').removeAttribute('transform');else returnHome(drag.kind);drag=null}});function level(){if(stage!==5||locked)return;shakeCount++;$('mound').style.opacity=String(Math.max(0,1-shakeCount/4));$('groundsIn').setAttribute('transform',`translate(${Math.sin(shakeCount)*1.8} 0)`);if(shakeCount>=4){locked=true;setTimeout(()=>{locked=false;advance()},450)}else notify(`粉床整平 ${Math.round(shakeCount/4*100)}%`)}$('shake').addEventListener('click',level);$('motion').addEventListener('click',async()=>{try{const r=await DeviceMotionEvent.requestPermission();if(r==='granted'){motionReady=true;render();notify('輕輕左右晃動手機')}else notify('可使用下方備用操作')}catch(e){notify('可使用下方備用操作')}});window.addEventListener('devicemotion',e=>{if(stage!==5||!motionReady)return;const a=e.accelerationIncludingGravity;if(!a)return;const v=a.x||0;if(Math.abs(v-prevAccel)>2.3){level();prevAccel=v}});$('tareHit').addEventListener('pointerdown',e=>{e.stopPropagation();if(stage!==6||locked)return;animate(550,()=>{$('scaleValue').textContent='0.0';notify('電子秤歸零 ✓')})});$('reset').addEventListener('click',()=>location.reload());$('next').addEventListener('click',()=>{if(stage===7)notify('第四關完成！可整合到咖啡世界下一關。')});render();})();
