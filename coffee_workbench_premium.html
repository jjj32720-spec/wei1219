<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手沖咖啡日常 - 3D 沉浸式手沖模擬器</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1411;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            text-align: center;
            color: #d1c7bd;
            background: rgba(26, 20, 17, 0.85);
            padding: 12px 24px;
            border-radius: 10px;
            backdrop-filter: blur(6px);
            max-width: 480px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.5s;
        }

        header h1 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #c29b61;
        }

        header p {
            margin: 0;
            font-size: 0.82rem;
            color: #a89f91;
        }

        .control-panel {
            background: rgba(35, 28, 24, 0.92);
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 320px;
            margin: 0 auto 15px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            pointer-events: auto;
        }

        .btn {
            background: #c29b61;
            color: #1a1411;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
            background: #b38b52;
        }

        #scorecard-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
            z-index: 100;
        }

        #scorecard-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .scorecard {
            background: #231c18;
            padding: 30px 40px;
            border-radius: 16px;
            border: 1px solid #c29b61;
            width: 380px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            color: #f3efe6;
            text-align: left;
        }

        .scorecard h2 {
            color: #c29b61;
            margin: 0 0 5px 0;
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .scorecard-subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #a89f91;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #d1c7bd;
        }

        .score-val {
            font-weight: bold;
            color: #76c7c0;
        }

        .flavor-notes {
            background: rgba(15, 12, 10, 0.6);
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 0.85rem;
            border: 1px dashed rgba(194, 155, 97, 0.3);
        }

        .flavor-notes span {
            color: #c29b61;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <header id="header-box">
            <h1 id="stage-title">01 | SECRET RECIPE</h1>
            <p id="stage-desc">觀察桌面上被咖啡漬暈染的紙本配方，輸入還原的 4 位數密碼 (預設: 4279)。</p>
        </header>

        <div class="control-panel" id="control-panel">
            <div style="display:flex; gap:10px; width:100%;">
                <input type="text" id="input-box" maxlength="4" value="4279" style="flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:#fff; text-align:center; font-size:1.2rem; letter-spacing:4px; padding:8px; outline:none;">
                <button class="btn" id="main-action-btn" style="width:110px; margin-top:0;">確認密碼</button>
            </div>
        </div>
    </div>

    <div id="scorecard-overlay">
        <div class="scorecard">
            <h2>MORNING BREW REPORT</h2>
            <div class="scorecard-subtitle">衣索比亞 耶加雪菲 · 一鏡到底職人手沖結算</div>
            
            <div class="score-row"><span>01. 神秘配方推理：</span><span class="score-val">完美還原 (4279)</span></div>
            <div class="score-row"><span>02. 盲秤精準度：</span><span class="score-val">14.0 g (誤差 0.0g)</span></div>
            <div class="score-row"><span>03. 研磨表現：</span><span class="score-val">均勻中細粉</span></div>
            <div class="score-row"><span>04. 沖煮準備：</span><span class="score-val">7 步驟標準合規</span></div>
            <div class="score-row"><span>05. 悶蒸控制：</span><span class="score-val">40g / 氣泡完美釋放</span></div>
            <div class="score-row"><span>06. 螺旋注水：</span><span class="score-val">88% 軌跡契合度</span></div>

            <div class="flavor-notes">
                <span>模擬風味輪廓：</span> 帶有優雅的茉莉花香、柑橘調性與絲滑茶體，尾韻清甜乾淨。
            </div>

            <button class="btn" onclick="location.reload()">再沖一杯咖啡</button>
        </div>
    </div>

    <script>
        // 全域遊戲狀態管理 (確保跨關卡數據一致)
        const GameState = {
            recipe: { code: "4279", beanWeight: 14.0, totalWater: 227.0, bloomWater: 40.0 },
            progress: { stage: 1 }
        };

        let scene, camera, renderer;
        let recipeMesh, scaleMesh, beanGroup, grinderGroup, dripperGroup, serverGroup, kettleGroup, cupGroup;
        let groundMesh, coffeeLiquidMesh;

        initScene();
        setupStage1();

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1411);
            scene.fog = new THREE.FogExp2(0x1a1411, 0.03);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.2, 2.8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xfff3e0, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xfffaed, 1.4);
            directionalLight.position.set(3, 8, 4);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const tableGeo = new THREE.PlaneGeometry(30, 30);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.4 });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.rotation.x = -Math.PI / 2;
            table.receiveShadow = true;
            scene.add(table);

            buildAllCoffeeAssets();
            window.addEventListener('resize', onWindowResize);
            requestAnimationFrame(animate);
        }

        function buildAllCoffeeAssets() {
            // 1. 配方紙
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1344;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f4efe6'; ctx.fillRect(0, 0, 1024, 1344);
            ctx.fillStyle = '#2c221e'; ctx.font = 'bold 52px sans-serif'; ctx.fillText("MORNING BREW RECIPE", 120, 160);
            ctx.font = '38px sans-serif'; 
            ctx.fillText("• 豆量： 14 g", 120, 580);
            ctx.fillText("• 水量： 227 g", 120, 680);
            ctx.fillText("• 水溫： 93°C", 120, 780);
            
            const tex = new THREE.CanvasTexture(canvas);
            recipeMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 4.2), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }));
            recipeMesh.rotation.x = -Math.PI / 2 + 0.1;
            recipeMesh.position.set(0, 0.02, 0);
            scene.add(recipeMesh);

            // 2. 電子秤與豆包
            scaleMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.2, 2.6), new THREE.MeshStandardMaterial({ color: 0xf0ede6, roughness: 0.3 }));
            scaleMesh.position.set(0, 0.1, 1.0);
            scene.add(scaleMesh);

            beanGroup = new THREE.Group();
            beanGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x2b3a32 })));
            beanGroup.position.set(-2.2, 1.1, 1.0);
            beanGroup.rotation.z = 0.2;
            scene.add(beanGroup);

            // 3. 磨豆機
            grinderGroup = new THREE.Group();
            grinderGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 2.0, 16), new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.6 })));
            grinderGroup.position.set(1.5, 1.0, 0);
            scene.add(grinderGroup);

            // 4. 濾杯與粉床
            dripperGroup = new THREE.Group();
            const dripper = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.9, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0x738678, roughness: 0.4 }));
            dripper.position.y = 0.9;
            dripperGroup.add(dripper);

            groundMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.35, 0.3, 32), new THREE.MeshStandardMaterial({ color: 0x3b2618, roughness: 0.9 }));
            groundMesh.position.set(0, 0.6, 0);
            dripperGroup.add(groundMesh);
            dripperGroup.position.set(0, 0.2, 0);
            scene.add(dripperGroup);

            // 5. 分享壺
            serverGroup = new THREE.Group();
            const serverBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.1, 16), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, roughness: 0.1, transmission: 0.9 }));
            serverBody.position.y = 0.55;
            serverGroup.add(serverBody);

            coffeeLiquidMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.68, 0.01, 16), new THREE.MeshBasicMaterial({ color: 0x3d1c02, transparent: true, opacity: 0.85 }));
            coffeeLiquidMesh.position.set(0, 0.15, 0);
            serverGroup.add(coffeeLiquidMesh);
            serverGroup.position.set(0, 0, 0);
            scene.add(serverGroup);

            // 6. 手沖壺
            kettleGroup = new THREE.Group();
            const kettleBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.7, 16), new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.3 }));
            kettleBody.position.y = 0.35;
            kettleGroup.add(kettleBody);
            kettleGroup.position.set(2.0, 1.6, 1.0);
            scene.add(kettleGroup);

            // 7. 咖啡杯
            cupGroup = new THREE.Group();
            const cupBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.6, 16), new THREE.MeshStandardMaterial({ color: 0xf5f0eb, roughness: 0.2 }));
            cupBody.position.y = 0.3;
            cupGroup.add(cupBody);
            cupGroup.position.set(1.4, 0, 0);
            scene.add(cupGroup);
        }

        function setupStage1() {
            document.getElementById('main-action-btn').onclick = () => {
                const val = document.getElementById('input-box').value.trim();
                if (val === GameState.recipe.code) {
                    transitionToStage2();
                } else {
                    alert('密碼錯誤！請輸入 4279');
                }
            };
        }

        function transitionToStage2() {
            GameState.progress.stage = 2;
            document.getElementById('stage-title').textContent = "02 | BLIND WEIGH";
            document.getElementById('stage-desc').textContent = "配方還原成功！鏡頭移向咖啡豆包與電子秤，盲秤 14.0g。";
            document.getElementById('control-panel').innerHTML = `<button class="btn" onclick="transitionToStage3()">完成盲秤 (14.0g)</button>`;
            gsap.to(camera.position, { x: -1.2, y: 3.2, z: 3.5, duration: 2.2, ease: "power2.inOut", onUpdate: () => camera.lookAt(0, 0.5, 1.0) });
        }

        function transitionToStage3() {
            GameState.progress.stage = 3;
            document.getElementById('stage-title').textContent = "03 | MORNING GRIND";
            document.getElementById('stage-desc').textContent = "盲秤完成！順時針轉動搖柄，限時完成研磨。";
            document.getElementById('control-panel').innerHTML = `<button class="btn" onclick="transitionToStage4()">完成限時磨豆</button>`;
            gsap.to(camera.position, { x: 1.5, y: 2.8, z: 2.0, duration: 2.0, ease: "power2.inOut", onUpdate: () => camera.lookAt(1.5, 1.0, 0) });
        }

        function transitionToStage4() {
            GameState.progress.stage = 4;
            document.getElementById('stage-title').textContent = "04 | BREW STATION";
            document.getElementById('stage-desc').textContent = "磨豆完成！檢視完整工作檯，完成 7 步驟準備與歸零。";
            document.getElementById('control-panel').innerHTML = `<button class="btn" onclick="transitionToStage5()">完成準備並歸零</button>`;
            gsap.to(camera.position, { x: 0, y: 3.5, z: 3.0, duration: 2.2, ease: "power2.inOut", onUpdate: () => camera.lookAt(0, 0.5, 0) });
        }

        function transitionToStage5() {
            GameState.progress.stage = 5;
            document.getElementById('stage-title').textContent = "05 | BLOOM RUSH";
            document.getElementById('stage-desc').textContent = "工作檯準備完成，注水 40g 進行極限悶蒸！";
            document.getElementById('control-panel').innerHTML = `<button class="btn" onclick="transitionToStage6()">完成悶蒸 (釋放氣泡)</button>`;
            gsap.to(camera.position, { x: 0, y: 2.0, z: 0.05, duration: 2.0, ease: "power2.inOut", onUpdate: () => camera.lookAt(0, 0.6, 0) });
        }

        function transitionToStage6() {
            GameState.progress.stage = 6;
            document.getElementById('stage-title').textContent = "06 | GOLDEN SPIRAL";
            document.getElementById('stage-desc').textContent = "悶蒸完成！黃金螺旋繞圈注水至總水量 227g。";
            document.getElementById('control-panel').innerHTML = `<button class="btn" onclick="transitionToStage7()">完成螺旋注水</button>`;
            gsap.to(kettleGroup.position, { x: 0.3, y: 1.6, z: 0.5, duration: 1.5 });
        }

        function transitionToStage7() {
            GameState.progress.stage = 7;
            document.getElementById('stage-title').textContent = "FINAL CUP";
            document.getElementById('stage-desc').textContent = "靜心等待滴濾完成，將咖啡倒入杯中。";
            document.getElementById('control-panel').innerHTML = `<button class="btn" onclick="showScorecard()">完成品嚐結算</button>`;
            gsap.to(kettleGroup.position, { x: 3, y: 3, duration: 1 });
            gsap.to(camera.position, { x: 1.2, y: 2.2, z: 2.2, duration: 2.5, ease: "power2.inOut", onUpdate: () => camera.lookAt(0, 0.6, 0) });
            gsap.to(coffeeLiquidMesh.scale, { y: 25, duration: 2.0 });
            gsap.to(coffeeLiquidMesh.position, { y: 0.35, duration: 2.0 });
        }

        function showScorecard() {
            document.getElementById('control-panel').style.display = 'none';
            document.getElementById('header-box').style.opacity = '0';
            document.getElementById('scorecard-overlay').classList.add('show');
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
