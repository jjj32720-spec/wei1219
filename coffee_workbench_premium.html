<style>

.sl{display:flex;gap:6px;justify-content:center}.sl i{width:44px;height:46px;border:2px solid var(--gd);border-radius:10px;display:grid;place-items:center;font:800 24px "Noto Serif TC",serif;font-style:normal}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.kp button{padding:9px;background:#0004;color:var(--tx);border:1px solid #fff2}.kp button:last-child{background:var(--gd);color:#2b1d15}
.cl{font-size:12px;color:#cbbd9f;margin:6px 0;text-align:center}.lg{font-size:12px;max-height:70px;overflow:auto;color:#cbbd9f}
details{font-size:12px}
.ov{position:fixed;inset:0;background:#140c08e6;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.ov.on{display:flex}
.cd{background:var(--pn);border:1px solid var(--gd);border-radius:16px;padding:18px;max-width:380px;width:100%}.cd h2{font:800 20px "Noto Serif TC",serif;margin:0 0 6px}.cd li{margin:3px 0}
.rw{display:flex;justify-content:space-between;border-bottom:1px solid #fff1;padding:3px 0}
textarea{width:100%;height:60px;background:#0004;color:var(--tx);border:1px solid #fff3;border-radius:8px;font-size:11px}

/* 3D art pass: SVG continues to own all gestures, effects, and game logic. */
#art3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#sv{position:relative;z-index:0}
#tools>g{opacity:0} /* Keep original SVG hit regions and transforms intact. */
#ring,#stm,#fb{position:relative}

<div class="ov on" id="intro"><div class="cd"><h2>DAILY BREW</h2><p>五分鐘，在同一間咖啡工作室裡，從解開配方到倒出一杯手沖。點亮的器具就是下一步。</p><div class="row"><button class="sec" id="m0">不限時測試</button><button id="m1">嚴格 5 分鐘</button></div><p><small>選擇後進入工作室。規則彈窗閱讀時計時會暫停。</small></p></div></div>
<div class="ov" id="rl"><div class="cd"><h2 id="rt"></h2><ul id="rb"></ul><p id="rg" style="color:var(--gd)"></p><button id="go" style="width:100%">了解，開始挑戰</button></div></div>
<script>
const $=s=>document.querySelector(s),sv=$('#sv'),G={},P={},NM=['','神秘配方','盲秤挑戰','手搖磨豆','沖煮工作檯','極限悶蒸','黃金螺旋','最終倒杯'];
document.querySelectorAll('#tools>g').forEach(g=>G[g.id]=g);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function place(id,x,y,r=0){P[id]={x,y,r};G[id].setAttribute('transform',`translate(${x} ${y}) rotate(${r})`)}
function tw(id,x,y,r=0,ms=500){return new Promise(res=>{const a={...P[id]},t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);place(id,a.x+(x-a.x)*e,a.y+(y-a.y)*e,a.r+(r-a.r)*e);k<1?requestAnimationFrame(f):res()})(t0)})}
const HOME={paper:[45,58],bag:[50,200],cup:[62,264],scale:[205,254],server:[205,246],dripper:[205,206],filter:[110,176],kettle:[360,215],waste:[290,274],grinder:[325,160],mug:[140,264]};
for(const k in HOME)place(k,...HOME[k]);
const REST=[255,228];
const V={hub:[0,0,400,300],recipe:[0,8,100,75],weigh:[90,160,230,172],grind:[245,45,160,120],st:[40,95,340,255],bloom:[150,150,130,98],spiral:[150,150,130,98],fin:[85,165,200,150],end:[85,185,120,90]};
let vb=[...V.hub];
function cam(n,ms=900){const a=[...vb],b=V[n],t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;vb=a.map((v,i)=>v+(b[i]-v)*e);sv.setAttribute('viewBox',vb.join(' '));if(k<1)requestAnimationFrame(f)})(t0)}
/* single source of truth for objects */
const S={sw:0,powder:0,tare:0,wet:0,paper:0,bed:0,bub:0,cupAmt:0,gr:0,cs:0,srv:1,hop:0,jar:0,mug:0,wl:0,blind:0,coffee:0,dose:14};
const reading=()=>Math.max(0,(S.srv?S.sw+S.powder:0)+(S.cs?S.cupAmt:0)-S.tare);
function rend(){const rd=reading(),set=(id,o)=>{const e=$('#'+id);for(const k in o)e.setAttribute(k,o[k])};
$('#sd').textContent=S.blind?'--.-':rd.toFixed(1);const sg=$('#sg');if(sg)sg.textContent=(S.blind?'--.-':rd.toFixed(1))+' g';
let h=S.sw/260*34;set('sf',{y:-h,height:h,fill:S.coffee?'#5a361e':'#bcd9e6'});h=S.cupAmt/17*22;set('cf',{y:-2-h,height:h,fill:S.gr?'#4a2b18':'#7a4a27'});
set('hf',{y:-66-S.hop*15,height:S.hop*15});set('jf',{y:-1-S.jar*22,height:S.jar*22});set('mf',{y:-2-S.mug*22,height:S.mug*22});set('wl',{opacity:S.wl});
set('fp',{opacity:S.paper,fill:S.wet?'#e3d9bb':'#fdfaf0'});set('md',{opacity:S.bed==1?1:0});set('bd',{opacity:S.bed>=2?1:0});set('bb',{opacity:S.bub})}
(function L(){rend();requestAnimationFrame(L)})();
/* helpers */
const ui=h=>{$('#pn').innerHTML=h},msg=(t,w)=>{const m=$('#msg');if(m){m.textContent=t;m.style.color=w?'var(--bad)':''}};
let tk;function toast(t){const e=$('#tt');e.textContent=t;e.style.opacity=1;clearTimeout(tk);tk=setTimeout(()=>e.style.opacity=0,1700)}
const ring=$('#ring'),RO={paper:[0,0],bag:[0,-18],cup:[0,-12],grinder:[0,-45],filter:[0,-8],kettle:[0,-18],dripper:[0,-14],server:[0,-20],scale:[0,-2],mug:[0,-12]};
function hl(id){if(!id){ring.setAttribute('opacity',0);return}ring.setAttribute('cx',P[id].x+RO[id][0]);ring.setAttribute('cy',P[id].y+RO[id][1]);ring.setAttribute('opacity',1)}
/* clock */
const T={t0:0,ps:0,paused:0,done:0,strict:0,on:0};
const el=()=>((T.ps||performance.now())-T.t0-T.paused)/1000,fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
setInterval(()=>{if(!T.on||T.done)return;const e=el();$('#clk').textContent=T.strict?fmt(Math.max(0,300-e)):'+'+fmt(e);if(T.strict&&e>=300)end(1)},250);
/* input */
let H={},d=null,tok=0,unlocked=1,rec=[],cur=0;
const svp=e=>{const q=sv.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(sv.getScreenCTM().inverse())};
sv.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-t]');H.down&&H.down(e,t&&t.dataset.t)});
addEventListener('pointermove',e=>{if(d){const p=svp(e);place(d.id,clamp(p.x+d.ox,5,395),clamp(p.y+d.oy,25,295),0)}H.move&&H.move(e)});
const UP=e=>{if(d){const q=P[d.id],x=d.tg,dd=d;d=null;Math.hypot(q.x-x[0],q.y-x[1])<=x[2]?dd.ok():dd.bad()}H.up&&H.up(e)};addEventListener('pointerup',UP);addEventListener('pointercancel',UP);
function grab(e,id,tg,ok,bad){const p=svp(e);d={id,ox:P[id].x-p.x,oy:P[id].y-p.y,tg,ok,bad};hl(null)}
/* hub / rules / completion */
const TOOL=[0,['paper'],['bag','cup'],['grinder'],['filter'],['kettle'],['dripper'],['server','mug']];
const RULES=[0,['找回配方','紙上的數字被咖啡浸濕。用 1A2B 線索推理四位密碼。',['A＝數字與位置都對，B＝數字對、位置不對','四次提示各揭露一格'],'解開 4279'],
['盲秤挑戰','按住按鈕讓咖啡包傾斜、豆子倒進量杯。放開即停止。',['最後 3g 隱藏讀數','放手後才揭曉重量'],'14.0g ±1.5g 過關'],
['手搖磨豆','手指順時針繞著搖柄畫圈，豆槽變少、粉杯變多。',['從搖柄附近開始繞圈','只計算順時針'],'進度到 100%（記錄耗時）'],
['沖煮準備','七個動作，每一步只有一件器具可以動。',['拖濾紙、拿壺、倒廢水、放回、倒粉','整平粉床後點歸零鍵'],'完成七步，歸零到 0.0g'],
['極限悶蒸','右側滑桿控制流速，注入 40g。出現 STOP 立刻拉到底。',['26 秒內完成','流速太快會濺出'],'37–43g，至少成功 1 次 STOP'],
['黃金螺旋','先看金色路線，再用手指從中心向外繞圈注水到 227g。',['金線是標準，藍線是你的','粉床要均勻濕潤'],'相似度 ≥65，覆蓋率 ≥85%，水量 227g'],
['最終倒杯','拿起玻璃壺，傾斜把咖啡倒進杯子。',['拖壺到杯子上方','倒完即停止計時'],'倒完整壺咖啡']];
function hub(){tok++;H={};d=null;$('#cv').style.display='none';$('#fl').style.display='none';$('#cue').style.opacity=0;hl(null);cam('hub');$('#ttl').textContent='DAILY BREW｜咖啡工作室';$('#pg').style.width=((unlocked-1)/7*100)+'%';
ui(`<p><b>咖啡工作室</b></p><p>點選虛線圈起來的器具，進行第 ${unlocked} 步：${NM[unlocked]}。</p><small>在這裡逛逛也會計時，其他器具現在還不能用。</small>`);
setTimeout(()=>{hl(TOOL[unlocked][0])},400);
H.down=(e,t)=>{if(!t||T.done)return;if(TOOL[unlocked].includes(t))rules(unlocked);else toast(t=='scale'?'電子秤會在後面用到':'現在還不是這件器具，找找虛線圈')}}
function rules(n){T.ps=performance.now();const r=RULES[n];$('#rt').textContent=n+' / '+r[0];$('#rb').innerHTML=r[2].map(x=>`<li>${x}</li>`).join('')+`<li>${r[1]}</li>`;$('#rg').textContent='過關：'+r[3];$('#rl').classList.add('on');cur=n}
$('#go').onclick=()=>{T.paused+=performance.now()-T.ps;T.ps=0;$('#rl').classList.remove('on');const n=cur;rec[n]={n,name:NM[n],att:0,t0:el(),sec:0,score:0};tok++;H={};hl(null);$('#ttl').textContent=n+' / 7｜'+NM[n];[0,s1,s2,s3,s4,s5,s6,s7][n]()};
function done(n,score,extra={}){const r=rec[n];r.sec=+(el()-r.t0).toFixed(1);r.score=Math.round(score);Object.assign(r,extra);unlocked=n+1;toast('✓ '+NM[n]+' 完成　'+r.score+' 分');setTimeout(()=>n==7?end(0):hub(),1200)}
$('#m0').onclick=$('#m1').onclick=e=>{T.strict=e.target.id=='m1'?1:0;T.t0=performance.now();T.on=1;$('#intro').classList.remove('on');hub()};
