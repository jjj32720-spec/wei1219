else if(current===2){title.textContent='02 · 盲秤挑戰';content.innerHTML=`<p>按住倒豆，放開停止。接近目標時，電子秤會暫時遮住數字。目標：14.0 g（容許 ±0.6 g）。</p><div id="scaleArt"><div id="beans"><span class="bean"></span><span class="bean"></span><span class="bean"></span><span class="bean"></span><span class="bean"></span></div><div id="fallBeans"></div><div id="cupArt"></div><div id="scaleBody"><div id="scaleScreen">0.0g</div></div></div><div class="flex"><button id="hold">按住倒豆</button><button id="finishWeigh">停止並檢查</button></div><button class="full" id="resetWeigh">重新秤豆</button>`;const hold=document.getElementById('hold');const stop=()=>{holding=false;hold.textContent='按住倒豆';document.getElementById('scaleArt').classList.remove('pouring-beans')};hold.addEventListener('pointerdown',e=>{e.preventDefault();holding=true;hold.setPointerCapture(e.pointerId);hold.textContent='正在倒豆…';document.getElementById('scaleArt').classList.add('pouring-beans')});hold.addEventListener('pointerup',stop);hold.addEventListener('pointercancel',stop);hold.addEventListener('lostpointercapture',stop);hold.addEventListener('contextmenu',e=>e.preventDefault());document.getElementById('finishWeigh').onclick=()=>{stop();if(Math.abs(grams-14)<=.6){current=3;show()}else msg.textContent=`實際重量 ${grams.toFixed(1)}g，${grams<13.4?'不足':'超出'}目標，請重新嘗試。`};document.getElementById('resetWeigh').onclick=()=>{stop();grams=0;refreshScale()};refreshScale();}

;ctx.ellipse(cx+Math.cos(angle)*103,cy-80+Math.sin(angle)*65,16,19,0,0,7);ctx.fill();document.getElementById('progressBar').style.width=(powder*100)+'%';if(powder>=1){document.getElementById('nextGrind').disabled=false;msg.textContent='磨豆完成！透明粉杯裡已裝滿咖啡粉。'}requestAnimationFrame(draw)}draw();function ang(e){let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*c.width-c.width/2,y=(e.clientY-r.top)/r.height*c.height-30;return Math.atan2(y,x)}c.onpointerdown=e=>{drag=true;previous=ang(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag||grind>=30)return;let a=ang(e),d=a-previous;while(d>Math.PI)d-=2*Math.PI;while(d< -Math.PI)d+=2*Math.PI;if(d>0&&d<1.2)grind+=d/(Math.PI*2);previous=a};c.onpointerup=c.onpointercancel=()=>{drag=false;previous=null};document.getElementById('restartGrind').onclick=()=>{grind=0;msg.textContent='';document.getElementById('nextGrind').disabled=true};document.getElementById('nextGrind').onclick=()=>{root.remove();window.dispatchEvent(new Event('dailybrew:introcomplete'))};}}
