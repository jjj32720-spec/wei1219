function registerMiss(n){if(n.done)return;n.done=true;n.el?.remove();miss++;counts.miss++;combo=0;say('MISS','#ff738c');haptic('miss',n.l);drawStats()}
function finish(){running=false;paused=false;cancelAnimationFrame(raf);holding.clear();$('status').textContent='FINISH';const acc=hit+miss?(counts.perfect+counts.great*.75+counts.good*.4)/(hit+miss)*100:0;const bonus=acc>=95?1.30:acc>=90?1.20:acc>=80?1.12:acc>=70?1.06:1;score=Math.round(score*bonus);const previousBest=bestScore;const isNewRecord=score>previousBest;if(isNewRecord){bestScore=score;try{localStorage.setItem(RECORD_KEY,String(score))}catch(e){}showBest();$('bestBadge').textContent='NEW RECORD!'}else{$('bestBadge').textContent=''}const grade=score>=185000?'S':score>=150000?'A':score>=110000?'B':score>=70000?'C':'D';overlay.classList.remove('hidden');overlay.querySelector('h2').textContent='演奏完成！';overlay.querySelector('p').innerHTML=`<div class="grade">${grade}</div><div class="result">總分 <b>${score.toLocaleString()}</b>　${isNewRecord?"🏆 NEW RECORD!":"歷史最高 "+bestScore.toLocaleString()}<br>最高連擊 <b>${maxCombo}</b><br>PERFECT ${counts.perfect}　GREAT ${counts.great}<br>GOOD ${counts.good}　MISS ${counts.miss}<br>節奏準確度 ${acc.toFixed(1)}%　結算加成 ×${bonus.toFixed(2)}</div>`;$('start').textContent='再玩一次';try{parent.postMessage({type:'playerOneRhythmResult',score:score,accuracy:acc,grade:grade},'*')}catch(e){}}
function frame(){if(!running)return;const t=clock(),h=stage.clientHeight,line=h*.82;for(const n of notes){if(n.done)continue;if(n.started){if(t>=n.t+n.hold){completeHold(n);continue}if(n.el){n.el.style.top=(line-(n.hold-(t-n.t))/LEAD*(line+30)-9)+'px';n.el.style.setProperty('--hold-height',Math.max(22,n.hold/LEAD*(line+30))+'px')}continue}if(t>n.t+.19){registerMiss(n);continue}const dt=n.t-t;if(dt>LEAD)continue;if(!n.el){n.el=document.createElement('div');n.el.className='note'+(n.hold?' hold':'');n.el.style.color=cols[n.l];n.el.style.left=n.l*25+'%';if(n.hold)n.el.style.setProperty('--hold-height',Math.max(25,n.hold/LEAD*(line+30))+'px');stage.appendChild(n.el)}const y=line-dt/LEAD*(line+30)-9;n.el.style.top=(n.hold?y-n.hold/LEAD*(line+30):y)+'px'}if(audio.currentTime>=END||audio.ended){audio.pause();finish();return}raf=requestAnimationFrame(frame)}
function award(n,delta,hold=false){if(n.done)return;n.done=true;n.el?.remove();hit++;combo++;maxCombo=Math.max(combo,maxCombo);const quality=delta<=.065?'perfect':delta<=.12?'great':'good';counts[quality]++;const base=quality==='perfect'?1000:quality==='great'?700:400;const comboMultiplier=1+Math.min(combo-1,100)*.012;const pts=Math.round((base+(hold?450:0))*comboMultiplier);score+=pts;haptic(hold?'holdEnd':quality,n.l);say(hold?'HOLD CLEAR!':quality.toUpperCase(),cols[n.l]);effects(n.l,pts);drawStats();if(combo%10===0){const e=document.createElement('div');e.className='combo-banner';e.textContent=combo+' COMBO!';stage.appendChild(e);setTimeout(()=>e.remove(),650)}}
function completeHold(n){holding.delete(n.l);document.querySelector(`.key[data-l="${n.l}"]`)?.classList.remove('haptic-hold');award(n,n.initialDiff||0,true)}
function tap(l){flashKey(l,true);if(!running)return;const t=clock();let candidate=null,diff=Infinity;for(const n of notes){if(n.done||n.started||n.l!==l)continue;const d=Math.abs(n.t-t);if(d<diff){diff=d;candidate=n}}if(candidate&&diff<=.19){if(candidate.hold){candidate.started=true;candidate.initialDiff=diff;holding.set(l,candidate);candidate.el?.classList.add('holding');document.querySelector(`.key[data-l="${l}"]`)?.classList.add('haptic-hold');haptic('holdStart',l);say('HOLD!',cols[l])}else award(candidate,diff)}/* 空按不扣分、不斷 COMBO；只有音符過判定線未命中才算 MISS。 */}
function release(l){flashKey(l,false);document.querySelector(`.key[data-l="${l}"]`)?.classList.remove('haptic-hold');const n=holding.get(l);if(n){holding.delete(l);if(clock()>=n.t+n.hold-.075)completeHold(n);else{registerMiss(n);haptic('holdBreak',l);say('HOLD BREAK','#ff7b92')}}}
async function seekToSongSegment(){
 if(audio.readyState<1){await new Promise((resolve,reject)=>{const done=()=>{audio.removeEventListener('loadedmetadata',done);audio.removeEventListener('error',fail);resolve()};const fail=()=>{audio.removeEventListener('loadedmetadata',done);audio.removeEventListener('error',fail);reject(new Error('音檔無法載入'))};audio.addEventListener('loadedmetadata',done,{once:true});audio.addEventListener('error',fail,{once:true});audio.load()})}
 audio.currentTime=START;
 if(audio.seeking||Math.abs(audio.currentTime-START)>.15){await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{audio.removeEventListener('seeked',done);reject(new Error('歌曲定位逾時'))},5000);const done=()=>{clearTimeout(timeout);audio.removeEventListener('seeked',done);resolve()};audio.addEventListener('seeked',done,{once:true});if(!audio.seeking&&Math.abs(audio.currentTime-START)<.15)done()})}
 if(Math.abs(audio.currentTime-START)>.2)throw new Error('歌曲未能定位到試玩段落');
}
async function start(){++countdownToken;unlockFx();audio.pause();running=false;paused=false;cancelAnimationFrame(raf);setup();try{await seekToSongSegment()}catch(e){alert('無法載入歌曲試玩段落：'+e.message);return}if(!await countIn())return;try{await audio.play()}catch(e){alert('音樂無法播放：'+e.message);return}running=true;paused=false;overlay.classList.add('hidden');$('status').textContent='PLAYING';raf=requestAnimationFrame(frame)}
$('start').onclick=start;$('restart').onclick=start;$('pause').onclick=async()=>{if(!running&&!paused)return;if(running){audio.pause();running=false;paused=true;cancelAnimationFrame(raf);$('status').textContent='PAUSED';$('pause').textContent='繼續';$('pauseTop').textContent='▶'}else{if(!await countIn())return;try{await audio.play()}catch(e){return}running=true;paused=false;$('status').textContent='PLAYING';$('pause').textContent='暫停';$('pauseTop').textContent='Ⅱ';raf=requestAnimationFrame(frame)}};
for(const b of document.querySelectorAll('.key')){const l=Number(b.dataset.l);b.addEventListener('pointerdown',e=>{e.preventDefault();unlockFx();b.setPointerCapture(e.pointerId);tap(l)});b.addEventListener('pointerup',()=>release(l));b.addEventListener('pointercancel',()=>release(l));b.addEventListener('lostpointercapture',()=>release(l))}
const heldKeys=new Set();window.addEventListener('keydown',e=>{const m={d:0,f:1,j:2,k:3},k=e.key.toLowerCase();if(m[k]!==undefined&&!heldKeys.has(k)){unlockFx();heldKeys.add(k);tap(m[k])}});window.addEventListener('keyup',e=>{const m={d:0,f:1,j:2,k:3},k=e.key.toLowerCase();if(m[k]!==undefined){heldKeys.delete(k);release(m[k])}});
$('settingsBtn').onclick=()=>{$('settingsModal').classList.remove('hidden')};
$('settingsClose').onclick=()=>{$('settingsModal').classList.add('hidden')};
$('settingsModal').addEventListener('click',e=>{if(e.target===$('settingsModal'))$('settingsModal').classList.add('hidden')});
$('pauseTop').onclick=()=>{$('pause').click()};
$('testFx').onclick=()=>{unlockFx();soundFeedback('perfect');setTimeout(()=>soundFeedback('holdStart'),150);setTimeout(()=>soundFeedback('holdEnd'),400)};
$('offset').oninput=()=>{$('offsetVal').textContent=$('offset').value+'ms'};audio.addEventListener('ended',()=>{if(running)finish()});setup();
</script></body></html>
