壞的音訊正在等待修復。用耳朵找出異常，調整控制台；系統只會在你提交後檢查。</p><div class="panel"><div class="top"><b id="roundTitle">ROUND 01 / 設備校準</b><span class="chip" id="status">SIGNAL CORRUPTED</span></div><div class="wave" id="wave"></div><div class="buttons"><button id="play">▶ 播放音訊</button><button id="restart" class="secondary">↺ 從頭播放</button></div><p class="muted">戴耳機效果較好。音檔只在點擊播放後開始。</p></div><div class="panel"><b>RESTORATION CONSOLE</b><p class="muted" id="instructions">第一關有 3 個異常參數，另外 2 個已經正常。請自行判斷。</p><div id="controls"></div></div><div class="panel"><b>辨識歌曲</b><p class="muted">修復完成後，選出你認為的歌名。</p><select id="guess"><option value="">選擇歌曲（不會立即判定）</option><option>稻香</option><option>偉大的渺小</option><option>日不落</option><option>粉色海洋</option><option>好不容易</option><option>大笨鐘</option><option>裹著心的光</option><option>幾分之幾</option></select><div class="buttons" style="margin-top:15px"><button id="submit">提交修復結果</button><button id="reset" class="secondary">重設旋鈕</button></div><div id="result" role="status" aria-live="polite"></div><div class="buttons" style="margin-top:14px"><button id="next" class="hidden">進入下一關 →</button></div></div><footer>試玩版：五項真實可聽的聲音效果控制（低頻、中頻、高頻、左右定位、殘響）。此版本尚未將人聲、鼓、貝斯做獨立分離；正式分軌版需另行製作。</footer></main><audio id="audio" preload="auto" crossorigin="anonymous"></audio><script>

const names=['BASS / 低頻','MID / 中頻','TREBLE / 高頻','PAN / 左右定位','REVERB / 殘響'];const audio=document.getElementById('audio');let round=0,values=[],ctx,src,bass,mid,treble,pan,dry,wet,delay,feedback,ready=false;
const $=id=>document.getElementById(id);$('wave').innerHTML=Array.from({length:52},(_,i)=>`<i style="height:${9+Math.abs(Math.sin(i*1.27)*47+Math.cos(i*.39)*18)}px"></i>`).join('');
function init(){if(ready)return;ctx=new (window.AudioContext||window.webkitAudioContext)();src=ctx.createMediaElementSource(audio);bass=ctx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=180;mid=ctx.createBiquadFilter();mid.type='peaking';mid.frequency.value=1200;mid.Q.value=.7;treble=ctx.createBiquadFilter();treble.type='highshelf';treble.frequency.value=3800;pan=ctx.createStereoPanner();dry=ctx.createGain();wet=ctx.createGain();delay=ctx.createDelay(1);delay.delayTime.value=.18;feedback=ctx.createGain();feedback.gain.value=.18;src.connect(bass);bass.connect(mid);mid.connect(treble);treble.connect(pan);pan.connect(dry);dry.connect(ctx.destination);pan.connect(delay);delay.connect(wet);wet.connect(ctx.destination);delay.connect(feedback);feedback.connect(delay);ready=true;apply();}
function apply(){if(!ready)return;bass.gain.value=(values[0]-50)*.28;mid.gain.value=(values[1]-50)*.22;treble.gain.value=(values[2]-50)*.28;pan.pan.value=(values[3]-50)/50;wet.gain.value=Math.max(0,(values[4]-50)/50)*.65;dry.gain.value=1;}
function controls(){ $('controls').innerHTML=names.map((n,i)=>`<div class="channel"><div class="label"><b>${n}</b><span id="val${i}">${values[i]} / 100</span></div><input aria-label="${n}" type="range" min="0" max="100" step="5" value="${values[i]}" data-index="${i}"></div>`).join('');document.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',()=>{let i=+el.dataset.index;values[i]=+el.value;$('val'+i).textContent=values[i]+' / 100';apply();}));}
function load(){audio.pause();audio.src=levels[round].file;audio.load();values=[...levels[round].start];$('roundTitle').textContent=levels[round].title;$('instructions').textContent=levels[round].hint;$('guess').value='';$('result').textContent='';$('next').classList.add('hidden');$('status').textContent='SIGNAL CORRUPTED';$('play').textContent='▶ 播放音訊';controls();apply();}
$('play').onclick=async()=>{init();await ctx.resume();if(audio.paused){await audio.play();$('play').textContent='Ⅱ 暫停';}else{audio.pause();$('play').textContent='▶ 播放音訊';}};
$('restart').onclick=async()=>{init();await ctx.resume();audio.currentTime=0;await audio.play();$('play').textContent='Ⅱ 暫停';};audio.onended=()=>$('play').textContent='▶ 播放音訊';
$('reset').onclick=()=>{values=[...levels[round].start];controls();apply();$('result').textContent='已重設，重新聆聽看看。';};
$('submit').onclick=()=>{const correct=levels[round].active.every(i=>Math.abs(values[i]-50)<=10);const guess=$('guess').value;let msg='';if(!correct)msg+='音訊尚未完全恢復。請繼續用耳朵調整。\n';if(!guess)msg+='還需要選擇歌曲名稱。';else if(guess!==levels[round].answer)msg+='歌曲辨識不正確，可以再聽一次。';else if(correct)msg+='歌曲辨識正確！';if(correct&&guess===levels[round].answer){msg='✓ 修復成功！你找回了《'+levels[round].answer+'》的聲音。';$('status').textContent='RESTORED';$('next').classList.remove('hidden');$('next').textContent=round===0?'進入第二關 →':'完成音軌修復室 ✓';} $('result').textContent=msg;};
$('next').onclick=()=>{if(round===0){round=1;load();window.scrollTo({top:0,behavior:'smooth'});}else{$('result').textContent='恭喜完成音軌修復室兩關！PLAYER ONE / RESTORATION COMPLETE';$('next').classList.add('hidden');}};
load();</script></body></html>
