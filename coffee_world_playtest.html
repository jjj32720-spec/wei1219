<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>COFFEE WORLD｜手沖挑戰試玩</title><style>
:root{--ink:#38271e;--muted:#937b67;--cream:#f8f0e4;--coffee:#795238;--accent:#bd8350;--good:#5e916f;--bad:#bc6056}*{box-sizing:border-box}body{margin:0;background:#e8dfd1;color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}main{max-width:510px;margin:auto;min-height:100dvh;background:linear-gradient(155deg,#fffaf2,#f4e9d9);padding:18px 17px 35px;box-shadow:0 0 40px #55432c20}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.kicker{font-size:10px;letter-spacing:3px;font-weight:900;color:var(--muted)}h1{font-family:Georgia,serif;letter-spacing:1px;margin:5px 0;font-size:27px}h2{font-size:21px;margin:0 0 7px}p{line-height:1.6}.small{font-size:12px;color:var(--muted)}.chip{font-size:11px;border:1px solid #cbb8a2;border-radius:20px;padding:6px 10px;white-space:nowrap}.bar{height:8px;background:#e0cfb9;border-radius:20px;overflow:hidden;margin:15px 0}.fill{height:100%;background:linear-gradient(90deg,#8c6241,#d5a26a);width:0%;transition:width .15s}.paper{background:#fffdf7;border:1px solid #e7d8c4;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 8px 25px #654d3020}.scene{border-radius:16px;background:radial-gradient(ellipse at 50% 25%,#e9d7be,#c9a883);height:260px;position:relative;overflow:hidden;touch-action:none;margin:15px 0}.scene.tall{height:320px}.btn{background:#745038;border:0;color:#fff;border-radius:13px;padding:13px 17px;font-size:15px;font-weight:800;cursor:pointer}.btn.alt{background:#e8d6c1;color:#563b2b}.btn:disabled{opacity:.4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions .btn{flex:1}.stats{display:flex;justify-content:space-between;gap:10px;margin:12px 0}.stats>div{background:#f4e7d7;border-radius:12px;padding:10px;flex:1;text-align:center}.stats strong{font-size:20px;display:block;font-variant-numeric:tabular-nums}.message{font-size:13px;color:#795d46;min-height:24px;margin:10px 0}.digit{width:49px;height:60px;text-align:center;font-size:29px;background:#f8eddd;border:1px solid #d8bfa4;border-radius:10px}.digits{display:flex;justify-content:center;gap:6px;margin:16px 0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{border:1px solid #d4b99a;background:#f5e8d6;color:#50392a;padding:12px;border-radius:11px;font-size:20px}.log{max-height:160px;overflow:auto;font-variant-numeric:tabular-nums}.log div{padding:6px 0;border-bottom:1px solid #f1e7d9}.note{background:#efe0c7;padding:13px;border-radius:10px;font-family:Georgia,serif;line-height:1.8}.circle{position:absolute;width:185px;height:185px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#9a7554 0 18%,#60432f 19% 64%,#cbb194 65% 71%,#8c6c51 72%);border:6px solid #87664b;box-shadow:0 12px 18px #39281835}.handle{position:absolute;width:92px;height:12px;background:linear-gradient(#e9e4dc,#9d9b97);left:50%;top:50%;transform-origin:0 50%;border-radius:9px;pointer-events:none}.handle:after{content:'';position:absolute;right:-11px;top:-8px;width:27px;height:27px;border-radius:50%;background:#563a28;border:3px solid #c7a181}.desk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}.tool{height:85px;background:#fff9efc9;border:2px solid #e4d0b4;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;color:#60442f}.tool span{font-size:33px}.tool:active{transform:scale(.96)}.tool.used{background:#e1f0df;border-color:#a2bea1}.scale{background:#2d302c;color:#b7f4b6;border-radius:10px;text-align:center;padding:16px;font-size:34px;font-family:monospace;letter-spacing:2px}.pourStage{display:flex;justify-content:space-around;align-items:center;height:180px}.kettle{font-size:85px;transform-origin:65% 65%;transition:transform .1s}.cup{font-size:88px}.pourLine{position:absolute;top:95px;left:42%;height:90px;width:5px;background:linear-gradient(#bce6f3,#d3f2f5aa);border-radius:10px;transform:rotate(14deg);pointer-events:none}.level{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);width:190px;height:75px;background:#e9d6b9;border:8px solid #a7825f;border-radius:20px 20px 55px 55px;overflow:hidden}.grounds{position:absolute;bottom:0;width:100%;height:35px;background:#68432c;clip-path:polygon(0 45%,30% 25%,52% 0,72% 28%,100% 45%,100% 100%,0 100%);transition:clip-path .3s}.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#67482e80;font-weight:800;text-align:center}.track{background:#e3d1b9;height:17px;border-radius:10px;position:relative;margin:18px 0}.track .good{position:absolute;left:40%;width:25%;height:100%;background:#91b18b88}.track .needle{position:absolute;left:0;top:-5px;height:27px;width:5px;background:#543d2d;border-radius:5px;transition:left .07s}.spiral{width:100%;height:100%;touch-action:none;display:block}.center{text-align:center}.success{color:var(--good)}.danger{color:var(--bad)}.hint{font-size:11px;line-height:1.6;color:#8e7965}.badge{background:#f1e1cd;border-radius:20px;padding:5px 9px;font-size:11px}.foot{text-align:center;margin-top:22px;font-size:11px;color:#ac967e}button{touch-action:manipulation}
</style></head><body><main><div class="top"><div><div class="kicker">PLAYER ONE / COFFEE WORLD</div><h1>THE PERFECT POUR</h1></div><span class="chip" id="stepBadge">01 / 07</span></div><div class="bar"><div class="fill" id="worldBar"></div></div><div id="app"></div><div class="foot">生日大冒險 · 咖啡世界獨立試玩版</div></main><script>
const app=document.querySelector('#app');let step=0,score={},clean=()=>{},state={},secret='4279',logs=[],input='',timeId=null;const recipe={dose:15,water:240,temp:93,bloom:40};
function resetCleanup(){clean();clean=()=>{};if(timeId){clearInterval(timeId);timeId=null}}
function render(){resetCleanup();document.querySelector('#stepBadge').textContent=String(step+1).padStart(2,'0')+' / 07';document.querySelector('#worldBar').style.width=step/7*100+'%';[recipeGame,blindGame,grindGame,stationGame,bloomGame,spiralGame,finishGame][step]()}
function shell(title,desc,body){app.innerHTML=`<div class="paper"><h2>${title}</h2><p class="small">${desc}</p>${body}</div>`}
function next(){step=Math.min(6,step+1);render()}
function btn(text,action='next()',alt=false){return `<button class="btn ${alt?'alt':''}" onclick="${action}">${text}</button>`}
function recipeGame(){shell('01 · SECRET RECIPE','破解四位不重複的配方編號，才能知道今天的沖煮參數。',`<div class="note">BREW NOTE #07<br>1234 → 1A1B<br>5678 → 1A0B<br>4071 → 2A0B<br><span class="hint">A：數字與位置正確　B：數字正確但位置錯誤</span></div><div class="digits" id="digits"></div><div class="keys" id="keys"></div><div class="message" id="msg">觀察舊紀錄，輸入你的推測。</div><div class="log" id="logs"></div><div class="actions"><button class="btn" onclick="submitGuess()">驗證配方</button><button class="btn alt" onclick="input='';updateGuess()">清除</button></div>`);let keys=document.querySelector('#keys');'123456789←0⌫'.split('').forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k==='←'||k==='⌫')input=input.slice(0,-1);else if(input.length<4&&!input.includes(k))input+=k;updateGuess()};keys.append(b)});updateGuess()}
function updateGuess(){document.querySelector('#digits').innerHTML=Array.from({length:4},(_,i)=>`<div class="digit">${input[i]||'·'}</div>`).join('');document.querySelector('#logs').innerHTML=logs.map(l=>`<div>${l[0]}　<strong>${l[1]}A${l[2]}B</strong></div>`).join('')}
function submitGuess(){if(input.length!==4){document.querySelector('#msg').textContent='需要四個不重複的數字。';return}let a=[...input].filter((x,i)=>x===secret[i]).length,b=[...input].filter(x=>secret.includes(x)).length-a;logs.unshift([input,a,b]);updateGuess();if(a===4){score.recipe=100;document.querySelector('#msg').innerHTML=`<strong class="success">配方已解鎖！</strong><br>15g 咖啡豆 · 93°C · 悶蒸 40g · 總注水 240g`;document.querySelector('.actions').innerHTML=btn('拿出咖啡豆 →');}else{document.querySelector('#msg').textContent=`${a}A${b}B，再試試看。`;input='';updateGuess()}}
function blindGame(){let weight=0,hidden=false,active=false,done=false,last=0,raf=0; shell('02 · BLIND WEIGH','長按豆罐倒豆。接近目標時讀數會隱藏；鬆手才會揭曉。',`<div class="scene" style="display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="font-size:72px">🫙</div><div class="scale" id="scale">0.0 g</div><div class="small" style="margin-top:15px">TARGET 15.0 g</div></div><div class="message" id="msg">按住下方按鈕，倒入咖啡豆。</div><div class="actions"><button class="btn" id="hold">按住倒豆</button><button class="btn alt" id="retry" style="display:none" onclick="render()">重試</button><button class="btn" id="go" style="display:none" onclick="next()">開始磨豆 →</button></div>`);let h=document.querySelector('#hold');function tick(t){if(!active)return;if(last)weight+=(t-last)/1000*2.3;last=t;if(weight>=12)hidden=true;document.querySelector('#scale').textContent=hidden?'--.- g':weight.toFixed(1)+' g';raf=requestAnimationFrame(tick)}function start(e){e.preventDefault();if(done)return;active=true;last=0;h.setPointerCapture?.(e.pointerId);raf=requestAnimationFrame(tick)}function end(){if(!active)return;active=false;cancelAnimationFrame(raf);done=true;document.querySelector('#scale').textContent=weight.toFixed(1)+' g';let err=Math.abs(weight-15);score.weigh=Math.max(0,Math.round(100-err*25));document.querySelector('#msg').textContent=`誤差 ${err.toFixed(1)}g · ${err<=.2?'PERFECT!':err<=1?'NICE!':'可以再挑戰一次'}`;h.style.display='none';document.querySelector('#retry').style.display='';document.querySelector('#go').style.display=''}h.addEventListener('pointerdown',start);['pointerup','pointercancel','lostpointercapture'].forEach(x=>h.addEventListener(x,end));clean=()=>{active=false;cancelAnimationFrame(raf)}}
function grindGame(){let turns=0,angle=0,last=null,startAt=0,remaining=65,playing=false,raf=0;let pct=()=>Math.min(100,turns<=8?turns*2.5:turns<=18?20+(turns-8)*4:60+(turns-18)*8);shell('03 · MORNING GRIND','上學快遲到了！65 秒內磨完豆子。手指沿搖柄繞圈，越磨進度越快。',`<div class="stats"><div><strong id="clock">65.0s</strong><span class="small">剩餘時間</span></div><div><strong id="pct">0%</strong><span class="small">磨豆進度</span></div></div><div class="scene" id="grindScene"><div class="circle"></div><div class="handle" id="handle"></div><div class="guide" style="align-items:flex-end;padding-bottom:14px">沿著磨豆機順時針畫圈 ↻</div></div><div class="bar"><div class="fill" id="progress"></div></div><div class="message" id="msg">觸碰搖柄開始倒數。</div><div class="actions"><button class="btn alt" onclick="render()">重新磨豆</button><button class="btn" id="go" style="display:none" onclick="next()">沖煮準備 →</button></div>`);let s=document.querySelector('#grindScene');function clock(t){if(!playing)return;remaining=Math.max(0,65-(t-startAt)/1000);document.querySelector('#clock').textContent=remaining.toFixed(1)+'s';if(remaining<=0){playing=false;document.querySelector('#msg').textContent='遲到了！再試一次吧。';return}raf=requestAnimationFrame(clock)}function update(){let p=pct();document.querySelector('#pct').textContent=p.toFixed(0)+'%';document.querySelector('#progress').style.width=p+'%';document.querySelector('#handle').style.transform=`rotate(${angle}deg)`;if(p>=100){playing=false;cancelAnimationFrame(raf);score.grind=Math.round(100*remaining/65);document.querySelector('#msg').textContent=`完成！還剩 ${remaining.toFixed(1)} 秒。`;document.querySelector('#go').style.display=''}}function move(e){if(remaining<=0||pct()>=100)return;let r=s.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,a=Math.atan2(y,x)*180/Math.PI;if(last!==null){let d=(a-last+540)%360-180;if(d>0&&d<110){angle+=d;turns+=d/360;update()}}last=a}function down(e){e.preventDefault();if(!playing&&remaining>0){playing=true;startAt=performance.now()-(65-remaining)*1000;raf=requestAnimationFrame(clock)}s.setPointerCapture(e.pointerId);last=null;move(e)}s.addEventListener('pointerdown',down);s.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});s.addEventListener('pointerup',()=>last=null);clean=()=>cancelAnimationFrame(raf)}
function stationGame(){let phase=0,levels=['濾紙','折濾紙','預濕','倒掉預濕水','放回秤上','倒入咖啡粉','整平粉床','電子秤歸零'];let done=false,motionCount=0,lastX=null;let icons=[['📄','濾紙'],['🔻','濾杯'],['🫖','熱水壺'],['🧪','分享壺'],['⚖️','電子秤'],['☕','咖啡粉']];shell('04 · BREW STATION','工作檯沒有步驟提示。按真實手沖順序準備器具，最後輕晃手機整平粉床。',`<div class="scene tall"><div class="desk" id="desk"></div><div class="level"><div class="grounds" id="grounds"></div></div></div><div class="message" id="msg">桌上有六種器具，從哪一個開始？</div><div class="actions"><button class="btn alt" onclick="render()">重新準備</button><button class="btn" id="motion" style="display:none">啟用手機體感</button><button class="btn alt" id="fallback" style="display:none">左右拖曳濾杯整平</button><button class="btn" id="go" style="display:none" onclick="next()">開始悶蒸 →</button></div>`);let desk=document.querySelector('#desk');icons.forEach(([icon,name],i)=>{let b=document.createElement('button');b.className='tool';b.innerHTML=`<span>${icon}</span>${name}`;b.onclick=()=>select(i,b);desk.append(b)});let expected=[0,0,2,3,4,5,1,4];function select(i,b){if(done)return;if(phase===6){if(i!==1){document.querySelector('#msg').textContent='濾杯裡的粉床還不平整。';return}enableMotion();return}if(i!==expected[phase]){document.querySelector('#msg').textContent='器具輕輕晃了一下，似乎還不是現在要用的。';return}b.classList.add('used');let words=['取出濾紙。','沿接縫折好，放進濾杯。','熱水浸濕濾紙，紙張慢慢貼合杯壁。','把預濕水倒入廢水容器。','分享壺與濾杯放回電子秤。','細緻的咖啡粉落進濾杯。','粉床整平了。','電子秤歸零：0.0g。'];document.querySelector('#msg').textContent=words[phase];phase++;if(phase===6){document.querySelector('#grounds').style.clipPath='polygon(0 45%,30% 25%,52% 0,72% 28%,100% 45%,100% 100%,0 100%)';document.querySelector('#motion').style.display='';document.querySelector('#fallback').style.display='';document.querySelector('#msg').textContent='咖啡粉已倒入。現在試著輕晃手機，讓粉床平整。'}if(phase===8){done=true;score.station=100;document.querySelector('#go').style.display=''}}function motion(e){let x=e.accelerationIncludingGravity?.x;if(typeof x!=='number')return;if(lastX!==null&&Math.abs(x-lastX)>1.1)shake();lastX=x}function shake(){if(phase!==6)return;motionCount++;let q=Math.min(1,motionCount/8);document.querySelector('#grounds').style.clipPath=`polygon(0 ${45+q*10}%,30% ${25+q*30}%,52% ${q*55}%,72% ${28+q*27}%,100% ${45+q*10}%,100% 100%,0 100%)`;document.querySelector('#msg').textContent='粉床整平中 '+Math.min(100,Math.round(q*100))+'%';if(q===1){phase=7;document.querySelector('#msg').textContent='粉床已整平。';document.querySelector('#motion').style.display='none';document.querySelector('#fallback').style.display='none'}}async function enableMotion(){if(phase!==6)return;let b=document.querySelector('#motion');try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){let p=await DeviceMotionEvent.requestPermission();if(p!=='granted')throw Error('未授權')}window.addEventListener('devicemotion',motion);b.textContent='體感已啟用 · 輕晃手機'}catch(e){document.querySelector('#msg').textContent='無法使用體感，請用備用拖曳操作。'}}document.querySelector('#motion').onclick=enableMotion;let fb=document.querySelector('#fallback'),fLast=null;fb.onclick=()=>shake();let scene=document.querySelector('.scene');scene.addEventListener('pointerdown',e=>{if(phase===6){fLast=e.clientX;scene.setPointerCapture(e.pointerId)}});scene.addEventListener('pointermove',e=>{if(phase===6&&fLast!==null&&Math.abs(e.clientX-fLast)>35){shake();fLast=e.clientX}});scene.addEventListener('pointerup',()=>fLast=null);clean=()=>window.removeEventListener('devicemotion',motion)}
function bloomGame(){let angle=0,flow=0,weight=0,spill=0,remaining=22,playing=false,finished=false,stops=0,successStops=0,stopUntil=0,stopAt=[5,12],last=0,raf=0;const target=40;let clamp=(x,a,b)=>Math.max(a,Math.min(b,x));shell('05 · BLOOM RUSH','22 秒內注入 40g。向上拖動加大壺身傾斜；兩次紅燈亮起時，立刻收水！',`<div class="stats"><div><strong id="clock">22.0s</strong><span class="small">剩餘時間</span></div><div><strong id="weight">0.0g</strong><span class="small">有效注水量</span></div><div><strong id="spills">0.0g</strong><span class="small">濺水量</span></div></div><div class="scene" id="pourScene"><div class="pourStage"><div class="kettle" id="kettle">🫖</div><div class="cup">☕</div></div><div class="pourLine" id="stream" style="display:none"></div><div class="guide" style="align-items:flex-end;padding-bottom:12px" id="cue">上下拖曳水壺控制傾斜</div></div><div class="track"><div class="good"></div><div class="needle" id="needle"></div></div><div class="stats"><div><strong id="tilt">0°</strong><span class="small">壺身傾斜</span></div><div><strong id="flow">0.0</strong><span class="small">流速 g/s</span></div><div><strong id="stop">0 / 2</strong><span class="small">停水成功</span></div></div><div class="message" id="msg">水壺的角度越大，出水越快，也越容易濺出。</div><div class="actions"><button class="btn alt" onclick="render()">重新挑戰</button><button class="btn" id="go" style="display:none" onclick="next()">進入螺旋注水 →</button></div>`);let s=document.querySelector('#pourScene'),startY=null,startAngle=0;function tilt(v){angle=clamp(v,0,75);document.querySelector('#tilt').textContent=Math.round(angle)+'°';document.querySelector('#kettle').style.transform=`rotate(${angle*.65}deg)`;document.querySelector('#needle').style.left=angle/75*98+'%'}function down(e){if(finished)return;e.preventDefault();s.setPointerCapture(e.pointerId);startY=e.clientY;startAngle=angle;if(!playing){playing=true;last=performance.now();raf=requestAnimationFrame(tick)}}function move(e){if(startY===null||finished)return;tilt(startAngle+(startY-e.clientY)*.35)}s.addEventListener('pointerdown',down);s.addEventListener('pointermove',move);s.addEventListener('pointerup',()=>startY=null);function finish(ok){finished=true;playing=false;cancelAnimationFrame(raf);let valid=weight>=38&&weight<=42&&successStops>=1&&remaining>0;let pass=ok&&valid;score.bloom=pass?Math.max(50,Math.round(100-Math.abs(weight-40)*15-spill*2-(2-successStops)*12)):0;document.querySelector('#msg').textContent=pass?`悶蒸完成！${weight.toFixed(1)}g · 停水 ${successStops}/2 · 接著等待至 0:35。`:`挑戰失敗：${weight.toFixed(1)}g · 停水 ${successStops}/2，請重試。`;document.querySelector('#cue').textContent=pass?'咖啡粉膨脹，氣泡逐漸散去…':'TRY AGAIN';if(pass){setTimeout(()=>{let b=document.querySelector('#go');if(b)b.style.display=''},1300)}}function tick(now){if(!playing)return;let dt=Math.min(.05,(now-last)/1000);last=now;remaining-=dt;let elapsed=22-remaining;let demand=stopAt[stops];if(stops<2&&elapsed>=demand){stops++;stopUntil=elapsed+1.15;document.querySelector('#cue').textContent='🔴 STOP! 立刻收水';s.style.background='#d58f7d'}if(stopUntil>0&&elapsed<=stopUntil){if(angle<=12){successStops++;stopUntil=0;s.style.background='radial-gradient(ellipse at 50% 25%,#e9d7be,#c9a883)';document.querySelector('#cue').textContent='🟢 GOOD! 繼續注水'}}else if(stopUntil>0&&elapsed>stopUntil){stopUntil=0;s.style.background='radial-gradient(ellipse at 50% 25%,#e9d7be,#c9a883)';document.querySelector('#cue').textContent='停水失敗！繼續'}let desired=angle<12?0:Math.pow((angle-12)/63,1.15)*6.2;flow+=(desired-flow)*Math.min(1,dt*4);let unstable=Math.max(0,(angle-48)/27);let lost=flow*dt*unstable*.45;spill+=lost;weight+=flow*dt-lost;document.querySelector('#stream').style.display=flow>.15?'':'none';document.querySelector('#stream').style.opacity=Math.min(1,flow/3);document.querySelector('#clock').textContent=Math.max(0,remaining).toFixed(1)+'s';document.querySelector('#weight').textContent=weight.toFixed(1)+'g';document.querySelector('#spills').textContent=spill.toFixed(1)+'g';document.querySelector('#flow').textContent=flow.toFixed(1);document.querySelector('#stop').textContent=successStops+' / 2';if(weight>42.3||remaining<=0){finish(false);return}if(weight>=38&&angle<=12&&flow<.25){finish(true);return}raf=requestAnimationFrame(tick)}clean=()=>cancelAnimationFrame(raf)}
function spiralGame(){let paths=[],drawing=false,pts=[],canvas,ctx,done=false; shell('06 · GOLDEN SPIRAL','記住由中心向外的螺旋。參考線會在 2 秒後消失；一筆畫出你的注水路線。',`<div class="scene tall" id="spiralScene"><canvas class="spiral" id="canvas"></canvas></div><div class="message" id="msg">先觀察標準路線，稍後開始。</div><div class="actions"><button class="btn alt" onclick="render()">重新畫線</button><button class="btn" id="go" style="display:none" onclick="next()">完成萃取 →</button></div>`);canvas=document.querySelector('#canvas');let r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);let w=r.width,h=r.height,cx=w/2,cy=h/2;function ideal(){let arr=[];for(let i=0;i<=150;i++){let t=i/150,ang=t*Math.PI*4-Math.PI/2,rad=8+t*Math.min(w,h)*.35;arr.push([cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad])}return arr}let goal=ideal();function drawPath(a,color,width=4){if(a.length<2)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}function backdrop(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#6c4931';ctx.beginPath();ctx.arc(cx,cy,Math.min(w,h)*.42,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d8b58d';ctx.lineWidth=12;ctx.stroke()}backdrop();drawPath(goal,'#f4dc9d',5);let ready=false;let tm=setTimeout(()=>{ready=true;backdrop();document.querySelector('#msg').textContent='開始！由中心向外畫兩圈螺旋。'},2200);function point(e){let b=canvas.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}canvas.addEventListener('pointerdown',e=>{if(!ready||done)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;pts=[point(e)];backdrop()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;pts.push(point(e));backdrop();drawPath(pts,'#f1dfc6',4)});canvas.addEventListener('pointerup',()=>{if(!drawing)return;drawing=false;done=true;let centerErr=Math.hypot(pts[0][0]-cx,pts[0][1]-cy),rad=pts.map(p=>Math.hypot(p[0]-cx,p[1]-cy));let progress=rad.length?rad[rad.length-1]-rad[0]:0;let lengths=0,turns=0;for(let i=1;i<pts.length;i++){lengths+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);let a=Math.atan2(pts[i-1][1]-cy,pts[i-1][0]-cx),b=Math.atan2(pts[i][1]-cy,pts[i][0]-cx);turns+=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI}let s=Math.max(0,Math.round(100-centerErr*.8-Math.abs(progress-Math.min(w,h)*.35)*.45-Math.abs(Math.abs(turns)/(2*Math.PI)-2)*18-Math.abs(lengths-650)*.025));score.spiral=s;drawPath(goal,'#e7c16b',3);drawPath(pts,'#fdf9ef',4);document.querySelector('#msg').textContent=`螺旋相似度 ${s} 分！金色是參考路線，白色是你的路線。`;document.querySelector('#go').style.display=''});clean=()=>clearTimeout(tm)}
function finishGame(){let entries=[['神秘配方',score.recipe],['盲秤挑戰',score.weigh],['限時磨豆',score.grind],['工作檯',score.station],['極限悶蒸',score.bloom],['螺旋注水',score.spiral]];let total=Math.round(entries.reduce((a,[,v])=>a+(v||0),0)/entries.length);shell('07 · FINAL CUP','滴濾完成。移開濾杯，這杯專屬咖啡終於完成了。',`<div class="scene center" style="display:flex;flex-direction:column;justify-content:center"><div style="font-size:105px">☕</div><div class="kicker">BREW COMPLETE</div></div><div class="center"><div class="small">TOTAL SCORE</div><h1 style="font-size:55px">${total}<span style="font-size:18px"> / 100</span></h1><div>${total>=85?'🏆 PERFECT BREW':total>=65?'✨ NICE BREW':'☕ FIRST BREW'}</div></div><div class="note" style="margin-top:20px">${entries.map(([k,v])=>`<div style="display:flex;justify-content:space-between"><span>${k}</span><strong>${v??'—'}</strong></div>`).join('')}</div><p class="small">這是遊戲操作評分，不代表真實咖啡的杯測結果。</p><div class="actions"><button class="btn" onclick="step=0;score={};logs=[];input='';render()">重新沖煮一杯</button></div>`);document.querySelector('#worldBar').style.width='100%'}render();
</script></body></html>
