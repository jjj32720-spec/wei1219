id;grid-template-columns:repeat(5,1fr);gap:4px;max-width:370px;margin:12px auto}.tile{aspect-ratio:1;background:#c6e9cb;border:2px solid white;border-radius:10px;font-size:24px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.tile.rock{background:#b8b2c9}.tile.goal{background:#ffe1a4}.tile.here{background:#ffb2c3}.dpad{display:grid;grid-template-columns:repeat(3,60px);gap:5px;justify-content:center}.dpad button{border:0;border-radius:12px;background:#c5b3f3;padding:10px;font-size:23px}.circuit{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:320px;margin:16px auto}.wire{aspect-ratio:1;border:3px solid white;border-radius:15px;background:#e6f5ff;display:grid;place-items:center;font-size:39px;cursor:pointer;touch-action:manipulation}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#44365f;color:white;border-radius:16px;padding:12px 20px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 5px 20px #0003}.progress{display:flex;gap:4px}.dot{height:8px;flex:1;border-radius:10px;background:#ddd2ef}.dot.on{background:#74cfa8}.confetti{font-size:50px;animation:bob 1.5s infinite alternate}@keyframes bob{to{transform:translateY(-12px) rotate(5deg)}}.back{border:0;background:transparent;color:#7054c8;font-weight:900;padding:9px 0}.hint{font-size:13px;background:#fff6d9;padding:12px;border-radius:12px}.tiny{font-size:12px}.hide{display:none!important}
</style></head><body><main id="app"></main><div id="toast" class="toast hide"></div><script>
const $=s=>document.querySelector(s), app=$('#app');

function home(){stopSoccer();stopMusic();let worlds=[['soccer','⚽','足球決賽','搖桿移動・射門'],['coffee','☕','手沖咖啡','長按倒水・秤重'],['music','🎤','演唱會','節奏點擊'],['travel','🌍','環球旅行','探索地圖・尋寶'],['electric','⚡','馬達實驗室','旋轉電路拼圖']];app.innerHTML=head()+`<section class="panel center"><div style="font-size:56px">🎂🕹️✨</div><h1>生日宇宙大冒險</h1><p>警告！生日系統發生異常。<br>請完成五個不同的小遊戲，找回能量核心！</p><div class="progress">${worlds.map(w=>`<div class="dot ${S.done.includes(w[0])?'on':''}"></div>`).join('')}</div><p class="muted">五個世界可自由選擇，進度會保存在這個瀏覽器。</p></section><section class="worlds">${worlds.map(w=>`<div class="world ${S.done.includes(w[0])?'done':''}" onclick="${w[0]}()"><span class="emoji">${w[1]}</span><b>${w[2]}</b><div class="status">${S.done.includes(w[0])?'✓ 已完成':w[3]}</div></div>`).join('')}</section><section class="panel center"><h2>🎁 最終生日禮物</h2><p class="muted">${S.done.length===5?'所有核心已收集，生日禮物已解鎖！':'完成五個世界即可開啟'}</p><button class="btn alt" ${S.done.length!==5?'disabled':''} onclick="finale()">開啟最終檔案</button></section><div class="center"><button class="back" onclick="if(confirm('確定要清除全部遊戲進度嗎？')){localStorage.removeItem('playerone_cute_v1');S={...base,done:[],cards:[],ach:[]};home()}">重置遊戲進度</button></div>`}
let soccerLoop=null, soccerState=null;
function stopSoccer(){if(soccerLoop){cancelAnimationFrame(soccerLoop);soccerLoop=null}soccerState=null}
function soccer(){stopSoccer();if(!S.cards.length){pack();return}soccerStart()}
const roster=[['👑','KANE','英格蘭王牌'],['🦁','LION','快速突破'],['🌟','STAR','全能球員'],['⚡','FLASH','閃電前鋒'],['🧤','KEEPER','門將之星'],['🐣','ROOKIE','新秀球員']];
function pack(){frame('⚽ 英格蘭決賽｜球員卡包','先拆開三張神秘球員卡，再選擇一名先發球員。',`<div class="center"><div style="font-size:66px">🎁</div><p>球員卡包已送達！</p><button class="btn alt" onclick="openPack()">✨ 開啟球員卡包</button></div>`)}

function chooseCard(){frame('⚽ 選擇先發球員','點選一張球員卡，進入足球場。',`<div class="cardgrid">${S.cards.map((c,i)=>`<div class="playercard ${S.selected===i?'chosen':''}" onclick="S.selected=${i};save();chooseCard()"><div class="face">${c[0]}</div><b>${c[1]}</b><small>${c[2]}</small></div>`).join('')}</div><div class="center"><button class="btn" onclick="S.selected=S.selected??0;save();soccerStart()">進入球場 →</button></div>`)}
function soccerStart(){stopSoccer();frame('⚽ 冠軍決賽｜最後一擊','左邊搖桿移動球員，避開兩名防守者；到達射門區後按右側射門。',`<canvas id="field" class="field" width="540" height="400"></canvas><div class="controls"><div id="joy" class="joystick"><div id="stick" class="stick"></div></div><button id="shoot" class="action">⚽<br>射門</button></div><p class="center tiny">小提示：把球帶到右側禁區，再射門！</p><div class="center"><button class="btn soft" onclick="chooseCard()">🃏 更換球員</button></div>`);
const canvas=$('#field'),ctx=canvas.getContext('2d'),joy=$('#joy'),stick=$('#stick');
let st={x:65,y:200,dx:0,dy:0,def:[{x:270,y:120,v:1.5},{x:340,y:300,v:-1.2}],hits:0};soccerState=st;
function setJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),max=39;if(len>max){x=x/len*max;y=y/len*max}st.dx=x/max;st.dy=y/max;stick.style.transform=`translate(${x}px,${y}px)`}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)};const clear=()=>{st.dx=st.dy=0;stick.style.transform=''};joy.onpointerup=clear;joy.onpointercancel=clear;
$('#shoot').onclick=()=>{if(st.x<410){toast('再往右邊靠近球門一點！');return}stopSoccer();frame('⚽ GOOOOAL！','Kane 與隊友衝向你慶祝！',`<div class="center"><div class="confetti">⚽🏆🎊</div><h2>絕殺成功！</h2><p>英格蘭拿下神秘冠軍！</p><button class="btn" onclick="done('soccer')">領取足球核心 💎</button></div>`)};
function tick(){if(soccerState!==st)return;st.x=Math.max(18,Math.min(500,st.x+st.dx*3.3));st.y=Math.max(22,Math.min(378,st.y+st.dy*3.3));for(let d of st.def){d.y+=d.v;if(d.y<45||d.y>355)d.v*=-1;if(Math.hypot(st.x-d.x,st.y-d.y)<31){st.x=65;st.y=200;st.hits++;if(st.hits===3)toast('防守好嚴密！再試一次 💪')}}ctx.clearRect(0,0,540,400);ctx.fillStyle='#8fd5a5';ctx.fillRect(0,0,540,400);for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#ffffff0d':'#ffffff1d';ctx.fillRect(i*90,0,90,400)}ctx.strokeStyle='white';ctx.lineWidth=3;ctx.strokeRect(18,18,504,364);ctx.beginPath();ctx.moveTo(270,18);ctx.lineTo(270,382);ctx.stroke();ctx.beginPath();ctx.arc(270,200,55,0,7);ctx.stroke();ctx.strokeRect(418,105,104,190);ctx.fillStyle='#fff3b0';ctx.fillRect(517,155,18,90);ctx.fillStyle='#fff9';ctx.fillRect(411,18,110,25);ctx.fillStyle='#695a7e';ctx.font='bold 15px system-ui';ctx.fillText('SHOOT ZONE',416,36);ctx.font='29px system-ui';for(let d of st.def)ctx.fillText('🟥',d.x-15,d.y+10);ctx.fillText('🧍',st.x-15,st.y+7);ctx.font='18px system-ui';ctx.fillText('⚽',st.x+10,st.y+21);soccerLoop=requestAnimationFrame(tick)}tick()}
let coffeeState={};
function coffee(){coffeeState={bean:0,grind:4,water:0,holding:false};frame('☕ 咖啡小工坊','真的動手操作：選豆、調整磨豆機、長按水壺沖煮。',`<div class="center"><div style="font-size:62px">🫘 ➜ ⚙️ ➜ ☕</div><p><b>STEP 1｜選咖啡豆</b></p><div><button class="bean active" data-bean="0">🌸 淺焙・日曬</button><button class="bean" data-bean="1">🍫 深焙・水洗</button></div><p><b>STEP 2｜磨豆機刻度</b></p><input id="grind" type="range" min="1" max="9" value="4" style="width:85%;accent-color:#9577d7"><p>目前刻度：<b id="grindval">4</b></p><p><b>STEP 3｜長按水壺倒水</b></p><div class="scale"><span id="grams">0</span> <small>g</small></div><div class="meter"><div id="waterfill" class="fill"></div></div><p class="tiny muted">目標：注入 240g，容許誤差 ±15g</p><button id="pour" class="hold">🫖<br>長按倒水</button><p><button class="btn" onclick="checkCoffee()">☕ 完成沖煮</button> <button class="btn soft" onclick="coffee()">重來</button></p></div>`);
document.querySelectorAll('[data-bean]').forEach(el=>el.onclick=()=>{coffeeState.bean=+el.dataset.bean;document.querySelectorAll('[data-bean]').forEach(x=>x.classList.toggle('active',x===el))});$('#grind').oninput=e=>{coffeeState.grind=+e.target.value;$('#grindval').textContent=e.target.value};const pour=$('#pour');let timer=null;function stop(){clearInterval(timer);timer=null}pour.onpointerdown=e=>{e.preventDefault();pour.setPointerCapture(e.pointerId);if(timer)return;timer=setInterval(()=>{coffeeState.water=Math.min(350,coffeeState.water+3);$('#grams').textContent=coffeeState.water;$('#waterfill').style.width=coffeeState.water/350*100+'%';if(coffeeState.water===350)stop()},75)};pour.onpointerup=stop;pour.onpointercancel=stop}
function checkCoffee(){let c=coffeeState;if(c.bean===0&&c.grind>=3&&c.grind<=6&&Math.abs(c.water-240)<=15){frame('☕ 完美的一杯','淺焙日曬的果香順利萃取！',`<div class="center"><div class="confetti">☕🌸✨</div><h2>手沖成功！</h2><p>風味：莓果、花香、今天心情很好</p><button class="btn" onclick="done('coffee')">領取咖啡核心 💎</button></div>`)}else toast(c.bean!==0?'提示：這杯似乎不是他最喜歡的豆子':c.grind<3||c.grind>6?'提示：磨豆刻度需要調整':'提示：注意電子秤的水量！')}
let musicLoop=null,musicState=null;function stopMusic(){if(musicLoop){cancelAnimationFrame(musicLoop);musicLoop=null}musicState=null}
function music(){stopMusic();frame('🎤 失控的演唱會','四條音軌的音符會落下。音符靠近虛線時，點擊下方對應按鈕！',`<div class="center"><p>🎶 曲目靈感：海闊天空・JJ・舞台回憶</p><h2 id="score">得分 0 / 8</h2></div><div class="notes">${[0,1,2,3].map(i=>`<div><div class="lane" id="lane${i}"><div class="hitline"></div></div><button class="pad" data-lane="${i}">${['🎵','🎶','⭐','💜'][i]}</button></div>`).join('')}</div><p class="center muted tiny">音符到接近底部虛線時按下；得分達 8 即通關。</p><div class="center"><button class="btn soft" onclick="music()">重新開始</button></div>`);
let st={score:0,note:null,last:0,miss:0};musicState=st;function spawn(){st.note={lane:Math.floor(Math.random()*4),y:-35};st.last=performance.now()}function hit(i){if(!st.note)return;if(i===st.note.lane&&st.note.y>=145&&st.note.y<=220){st.score++;$('#score').textContent=`得分 ${st.score} / 8`;st.note=null;if(st.score>=8){stopMusic();frame('🎤 演唱會復活！','燈光、旋律與掌聲全部回來了！',`<div class="center"><div class="confetti">🎤🎶🎉</div><h2>Encore!</h2><p>隱藏曲目：缺口／小薇 🤭</p><button class="btn" onclick="done('music')">領取音樂核心 💎</button></div>`)}}else toast('再抓準一點節奏！')}document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>hit(+b.dataset.lane));function tick(){if(musicState!==st)return;if(!st.note)spawn();st.note.y+=1.45;for(let i=0;i<4;i++)$('#lane'+i).querySelectorAll('.fall').forEach(x=>x.remove());let d=document.createElement('div');d.className='fall';d.style.top=st.note.y+'px';$('#lane'+st.note.lane).appendChild(d);if(st.note.y>230){st.note=null;st.miss++}musicLoop=requestAnimationFrame(tick)}tick()}
let travelState=null;
function travel(){travelState={x:0,y:4,found:[],moves:0};drawTravel()}
const travelMap=['..#..','...#.', '.#...', '...#.', '.....'];const items={'0,0':'🦁','4,0':'🗺️','2,2':'🧳','4,4':'🏔️'};
function drawTravel(){let st=travelState;frame('🌍 探險地圖｜坦尚尼亞 → 紐西蘭','用方向鍵移動探險家，找到三件旅行紀念物，再前往右下角的紐西蘭山峰。',`<div class="center"><b>已找到 ${st.found.length}/3 件旅行紀念物</b><div class="map">${travelMap.flatMap((row,y)=>row.split('').map((cell,x)=>{let key=x+','+y,here=st.x===x&&st.y===y,thing=items[key];return `<div class="tile ${cell==='#'?'rock':''} ${here?'here':''} ${thing==='🏔️'?'goal':''}">${here?'🧑‍✈️':cell==='#'?'🌳':thing&&(!st.found.includes(key)||thing==='🏔️')?thing:'·'}</div>`})).join('')}</div><div class="dpad"><span></span><button onclick="moveTravel(0,-1)">↑</button><span></span><button onclick="moveTravel(-1,0)">←</button><button onclick="moveTravel(0,1)">↓</button><button onclick="moveTravel(1,0)">→</button></div><p class="tiny muted">🌳 是障礙物；可以自由探索。</p></div>`)}
function moveTravel(dx,dy){let s=travelState,x=s.x+dx,y=s.y+dy;if(x<0||x>=5||y<0||y>=5||travelMap[y][x]==='#'){toast('這裡過不去，換條路吧！');return}s.x=x;s.y=y;s.moves++;let key=x+','+y;if(items[key]&&items[key]!=='🏔️'&&!s.found.includes(key)){s.found.push(key);toast('🎒 找到旅行紀念物！')}if(key==='4,4'){if(s.found.length===3){frame('🌍 旅行終點','穿越草原與山谷，下一站是紐西蘭！',`<div class="center"><div class="confetti">🦁✈️🏔️</div><h2>探險成功！</h2><p>還有好多地方等著你去看看。</p><button class="btn" onclick="done('travel')">領取旅行核心 💎</button></div>`);return}else toast('還有旅行紀念物沒找到！')}drawTravel()}
let circuitState=null;const initialCircuit=[1,0,2,3,1,0,2,3,1];const solution=[0,1,2,3,0,1,2,3,0];const wireGlyph=['┗','┏','┓','┛'];
function electric(){circuitState=[...initialCircuit];drawCircuit()}
function drawCircuit(){frame('⚡ 馬達控制實驗室','這是一個可愛版的虛構電路拼圖：點擊方塊旋轉線路，讓所有方向與目標配置一致。',`<div class="center"><div style="font-size:42px">🔋 ➜ ⚡ ➜ 🌀</div><p class="muted">工程師留下的參考電路：<br><b style="letter-spacing:8px">┗ ┏ ┓ / ┛ ┗ ┏ / ┓ ┛ ┗</b></p><div class="circuit">${circuitState.map((v,i)=>`<button class="wire" onclick="rotateWire(${i})">${wireGlyph[v]}</button>`).join('')}</div><p class="tiny">點一下旋轉 90°。依照參考圖完成九格拼圖。</p><button class="btn" onclick="checkCircuit()">🔌 啟動馬達</button> <button class="btn soft" onclick="electric()">重置</button></div>`)}
function rotateWire(i){circuitState[i]=(circuitState[i]+1)%4;drawCircuit()}
function checkCircuit(){if(circuitState.every((v,i)=>v===solution[i])){frame('⚡ 馬達成功啟動！','控制室恢復正常，這次沒有任何東西爆炸。',`<div class="center"><div class="confetti">⚡🌀🎉</div><h2>系統修復完成！</h2><p>AI：原來只要找對方向就可以了！</p><button class="btn" onclick="done('electric')">領取電力核心 💎</button></div>`)}else toast('還有幾個線路方向不對喔！')}
function finale(){if(S.done.length!==5)return;app.innerHTML=head()+`<section class="panel center"><div class="confetti">🎂🎊🏆</div><h1>MISSION COMPLETE!</h1><h2>生日快樂！</h2><p>恭喜最強玩家完成五個世界！</p><p>從足球場上的關鍵一擊，到手沖咖啡、舞台演出、遠方的冒險和馬達實驗室——這些世界不是隨機選的。</p><p><b>因為每一個，都是你身上很特別的一部分。</b></p><p>希望新的一歲，還有好多想踢的比賽、想聽的歌、想喝的咖啡，以及想去的地方等著你。</p><div style="font-size:58px">💌</div><p><b>Happy Birthday, Player One!</b></p><p class="muted">— 來自為你偷偷設計這場冒險的人 ♡</p><button class="btn alt" onclick="home()">回到世界地圖</button></section>`}
home();
</script></body></html>
