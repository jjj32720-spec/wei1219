<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYER ONE｜生日系統異常</title><style>
:root{--bg:#0a1020;--panel:#131f34;--panel2:#1a2a43;--ink:#eff6ff;--muted:#a8bdd2;--line:#35455e;--mint:#72e3bd;--gold:#ffd58c;--pink:#ff91ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1a3550 0,transparent 36%),radial-gradient(circle at 90% 20%,#322449 0,transparent 36%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;line-height:1.6;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:var(--panel2);color:var(--ink);transition:.15s}button:hover:not(:disabled){border-color:var(--mint);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--mint);color:#09222a;font-weight:800;border-color:transparent}.ghost{background:transparent}.danger{color:var(--pink)}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em;color:var(--mint)}.small{font-size:.82rem;color:var(--muted)}h1{font-size:clamp(2rem,6vw,4rem);line-height:1.15;margin:.5em 0}h2{margin:.2em 0 .7em;font-size:clamp(1.4rem,3vw,2rem)}h3{margin:.4em 0}.lead{font-size:1.1rem;color:#c8d8e8;max-width:680px}.panel{background:linear-gradient(140deg,#17263d,#111b2d);border:1px solid var(--line);border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 15px 40px #0002}.hero{padding:clamp(25px,6vw,65px) 0}.pill{display:inline-block;border:1px solid #427d78;color:var(--mint);border-radius:100px;padding:4px 12px;font-size:.8rem;letter-spacing:.1em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.world{min-height:210px;text-align:left;padding:20px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;background:linear-gradient(145deg,#223b50,#141e35);border:1px solid #40516b;border-radius:18px}.world .emoji{font-size:2.4rem}.world b{font-size:1.12rem}.world.done{border-color:var(--mint)}.world small{color:var(--muted)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.meter{height:10px;background:#24344a;border-radius:99px;overflow:hidden}.meter>div{height:100%;background:linear-gradient(90deg,#6bcab7,#e5ca87);transition:width .4s}.scene{border-radius:17px;background:linear-gradient(160deg,#1d3348,#152137);border:1px solid #4b6276;padding:22px;min-height:210px;margin:18px 0;position:relative;overflow:hidden}.scene:before{content:'✦';position:absolute;right:18px;top:-35px;font-size:150px;opacity:.045;pointer-events:none}.scene .big{font-size:4rem}.choices{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.choice.selected{border-color:var(--mint);background:#1e4a4a}.note{background:#25334a;border-left:3px solid var(--gold);padding:12px 14px;border-radius:8px;color:#e4eaf1}.ok{color:var(--mint)}.bad{color:#ff9b9b}.hidden{display:none!important}.stage{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.num{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold)}.pitch{position:relative;background:repeating-linear-gradient(90deg,#17503b 0,#17503b 15%,#195b40 15%,#195b40 30%);border:3px solid #c6e4d0;border-radius:10px;min-height:260px;display:flex;align-items:center;justify-content:center;margin:14px 0}.pitch:after{content:'';position:absolute;inset:18px;border:2px solid #ffffff55;pointer-events:none}.pitch .center{border:2px solid #ffffff66;border-radius:50%;width:105px;height:105px;position:absolute;left:calc(50% - 52px);top:calc(50% - 52px)}.players{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:90%;text-align:center}.player{border-radius:14px;background:#0b2831bd;border:1px solid #ffffff66;padding:9px 3px;font-size:.8rem}.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.goal button{min-height:85px;background:linear-gradient(#1c4259,#14364b);border:2px dashed #80a5b2}.coffeegear{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.coffeegear div{background:#25344a;border-radius:12px;padding:16px 6px;font-size:1.6rem}.coffeegear span{display:block;font-size:.75rem;color:var(--muted)}.range{width:100%;accent-color:var(--mint)}.keys{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.keys button{font-size:1.8rem;min-width:58px;height:62px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.map button{min-height:110px;font-size:1rem}.map button .emoji{font-size:1.8rem;display:block}.circuit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:18px;background:#0b1726;border-radius:14px;border:1px dashed #6b829c}.wire{height:4px;flex:1;min-width:15px;background:var(--mint)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9;background:#253f4e;border:1px solid var(--mint);padding:13px 20px;border-radius:12px;max-width:92%;box-shadow:0 10px 35px #0008}.footer{padding:25px 0;text-align:center;color:#8da5b8;font-size:.8rem}.inventory{display:flex;flex-wrap:wrap;gap:8px}.token{border-radius:99px;border:1px solid #7d6a46;color:var(--gold);padding:5px 12px;font-size:.82rem}.confetti{font-size:2rem;letter-spacing:.3em}.ach{padding:12px;border-radius:12px;background:#1a2b42;border:1px solid #344962}.ach.locked{opacity:.4;filter:grayscale(1)}input[type=text]{background:#0b1828;color:white;border:1px solid #4e657b;border-radius:10px;padding:12px;max-width:100%;width:280px}details{margin:16px 0;border:1px solid var(--line);border-radius:12px;padding:12px 15px}summary{cursor:pointer;font-weight:700}.fade{animation:appear .4s ease}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){.wrap{padding:14px}.panel{padding:17px}.scene{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.world{min-height:185px;padding:14px}.map{grid-template-columns:repeat(2,1fr)}.players{gap:5px;width:100%}.player{font-size:.7rem}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">◈ PLAYER ONE <span class="small">/ BIRTHDAY GLITCH</span></div><div class="row"><span class="small" id="saveLabel">本機自動存檔</span><button class="ghost" id="homeBtn" onclick="goHome()">⌂ 控制室</button></div></header><main id="app"></main><footer class="footer">PLAYER ONE · 為一位獨一無二的玩家打造 · 單檔離線可玩</footer></div><div id="toast" class="toast hidden" role="status"></div><script>
const KEY='player_one_birthday_v1';const worlds=[['football','⚽','最後一場決賽','足球競技場'],['coffee','☕','完美的一杯咖啡','咖啡實驗室'],['music','🎤','被封印的演唱會','音樂劇院'],['travel','🌍','遺失的旅行座標','環球旅行'],['electric','⚡','失控的控制中心','電力實驗室']];const defaultState=()=>({started:false,name:'PLAYER ONE',done:[],tokens:{},ach:[],hints:0,final:false});let S;try{S=Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=defaultState()}let current='home',step=0,temp={},hintShown=0;const app=document.getElementById('app');function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>x.classList.add('hidden'),2800)}function award(a){if(!S.ach.includes(a)){S.ach.push(a);save();toast('🏆 成就解鎖：'+a)}}function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function goHome(){current='home';render()}function start(){let n=document.getElementById('playerName')?.value.trim();S.started=true;if(n)S.name=n;save();goHome()}function enter(w){current=w;step=0;temp={};hintShown=0;render()}function progress(){return Math.round(S.done.length/5*100)}function finish(w,token,ach){if(!S.done.includes(w))S.done.push(w);S.tokens[w]=token;award(ach);save();render()}function panel(t){return `<div class="note">${t}</div>`}function hint(a,b,c){return `<details><summary>💡 需要提示嗎？（可逐步查看）</summary><p>提示一：${a}</p><button onclick="this.nextElementSibling.classList.remove('hidden');this.disabled=true;S.hints++;save()">顯示提示二</button><p class="hidden">提示二：${b}</p><p class="small">${c||'提示不影響通關，但會記錄使用次數。'}</p></details>`}function next(){step++;hintShown=0;render()}function render(){document.getElementById('homeBtn').style.display=current==='home'?'none':'';if(current==='home')return home();if(current==='final')return finale();const meta=worlds.find(x=>x[0]===current);let body=({football,coffee,music,travel,electric})[current]();app.innerHTML=`<section class="fade"><div class="top"><span class="pill">${meta[1]} ${meta[3]}</span><span class="small">${S.done.includes(current)?'✓ 已通關 · 可重玩':'任務進行中'}</span></div><h2>${meta[2]}</h2>${body}<div class="row">${btn('← 返回控制室','goHome()','ghost')}</div></section>`}function home(){if(!S.started){app.innerHTML=`<section class="hero fade"><span class="pill">SYSTEM ALERT · 12:19</span><h1>生日系統<br><span style="color:var(--mint)">發生異常。</span></h1><p class="lead">五個世界的核心失去連線。足球賽即將停擺、咖啡實驗室全面失控，甚至連演唱會的聲音都被偷走了……</p><div class="panel"><h3>唯一授權修復者：你</h3><p class="small">這是一款約 30–60 分鐘的互動冒險遊戲。可以自由探索五個世界，蒐集核心，最後解鎖秘密生日檔案。</p><label for="playerName">玩家代號（選填）</label><p><input id="playerName" type="text" maxlength="24" placeholder="PLAYER ONE" value="${esc(S.name==='PLAYER ONE'?'':S.name)}"></p>${btn('▶ 啟動任務','start()','primary')}</div></section>`;return}let done=S.done.length;app.innerHTML=`<section class="fade"><div class="hero" style="padding-bottom:10px"><span class="pill">CENTRAL CONTROL ROOM</span><h1>歡迎回來，<br><span style="color:var(--mint)">${esc(S.name)}</span></h1><p class="lead">五個世界等待修復。你可以自由選擇順序，每完成一個世界，就會取得一枚核心與一段最終解鎖線索。</p></div><div class="panel"><div class="row between"><b>系統修復進度</b><span class="num">${done} / 5</span></div><div class="meter" style="margin:12px 0"><div style="width:${progress()}%"></div></div><div class="inventory">${worlds.filter(w=>S.done.includes(w[0])).map(w=>`<span class="token">${w[1]} ${esc(S.tokens[w[0]])}</span>`).join('')||'<span class="small">尚未取得核心</span>'}</div></div><div class="grid">${worlds.map(w=>`<button class="world ${S.done.includes(w[0])?'done':''}" onclick="enter('${w[0]}')"><span class="emoji">${w[1]}</span><span><b>${w[2]}</b><br><small>${w[3]}</small></span><span class="small">${S.done.includes(w[0])?'✓ 核心已修復 · 可重玩':'進入世界 →'}</span></button>`).join('')}</div><div class="panel"><div class="row between"><div><h3>🔐 最終檔案</h3><p class="small">收集五個世界的線索，完成最後一道解鎖程序。</p></div>${done===5?btn('進入最終章 →',"current='final';render()",'primary'):'<button disabled>尚需 '+(5-done)+' 枚核心</button>'} </div></div><div class="panel"><div class="row between"><h3>🏆 成就收藏</h3><span class="small">${S.ach.length} 枚</span></div><div class="grid">${[['球場英雄','⚽'],['咖啡大師','☕'],['舞台之星','🎤'],['世界旅人','🌍'],['電力專家','⚡'],['空投獵人','📦'],['粉紅英雄','⭐'],['失誤之王','🤦'],['細節偵探','🔍'],['生日傳奇','🎂']].map(a=>`<div class="ach ${S.ach.includes(a[0])?'':'locked'}">${a[1]} ${S.ach.includes(a[0])?a[0]:'？？？'}</div>`).join('')}</div></div><details><summary>遊戲說明與重設</summary><p class="small">本遊戲的進度儲存在目前裝置與瀏覽器。提示可以使用，不影響結局。音樂關卡使用原創節奏音效，不包含商業歌曲錄音。</p>${btn('清除本機存檔','resetGame()','danger')}</details></section>`;if(done<5)app.querySelector('.panel:nth-of-type(2) button')?.setAttribute('disabled','')}function resetGame(){if(confirm('確定要刪除全部遊戲進度嗎？')){S=defaultState();save();goHome()}}
function football(){if(step===0)return `<div class="scene"><div class="big">🏟️</div><h3>英格蘭的最後一場決賽</h3><p>距離終場只剩幾分鐘。戰術 AI 把傳球資料弄丟了，Kane 正在禁區等待機會。你必須找到安全的進攻路線，再完成射門。</p>${panel('戰術備忘：對方守門員偏向左側；右側防線較空。先觀察隊友位置，再選擇傳球。')}</div>${btn('進入球場','next()','primary')}`;if(step===1)return `<div class="scene"><h3>階段 1／2 · 尋找傳球路線</h3><div class="pitch"><div class="center"></div><div class="players"><div class="player">🟥<br>左翼<br>被盯防</div><div class="player">⚪<br>Kane<br>禁區中央</div><div class="player">🟩<br>右翼<br>無人盯防</div></div></div><p>你在中場持球。要先把球交給誰，才能避開對方防守？</p><div class="choices">${btn('傳給左翼',"footballPass('left')")}${btn('直接傳 Kane',"footballPass('center')")}${btn('傳給右翼',"footballPass('right')")}</div>${hint('注意場上三個隊友的狀態。','選擇無人盯防的隊友。')}</div>`;if(step===2)return `<div class="scene"><h3>階段 2／2 · 決勝射門</h3><p>右翼突破後把球回傳給 Kane！根據賽前情報，守門員正向左側移動。</p><div class="goal">${btn('🥅 左側',"footballShot('left')")}${btn('🥅 中央',"footballShot('center')")}${btn('🥅 右側',"footballShot('right')")}</div><p class="small">提示：射門方向以進攻球員面向球門時的左右為準。</p>${hint('守門員會往左側移動。','射向他沒有防守到的右側。')}</div>`;return success('⚽','GOOOOOAL！','你完成了最後一擊，英格蘭球場重新亮起。','足球核心','生', 'football','球場英雄')}
function footballPass(x){if(x==='right'){toast('漂亮！右翼突破成功！');next()}else{temp.fails=(temp.fails||0)+1;toast(x==='left'?'左翼被斷球！守門員還在偷笑。':'Kane 被兩名後衛包夾了！');if(temp.fails>=3)award('失誤之王')}}function footballShot(x){if(x==='right'){step=3;finish('football','星','球場英雄')}else{temp.fails=(temp.fails||0)+1;toast(x==='left'?'守門員飛身撲救！':'球直接撞上守門員的肚子。');if(temp.fails>=3)award('失誤之王')}}
function coffee(){if(step===0)return `<div class="scene"><div class="big">☕</div><h3>實驗室 07：完美的一杯</h3><p>手沖機器人把豆單弄亂了。它堅稱「深焙、重苦、焦香」就是你最喜歡的咖啡。你決定親自接手。</p>${panel('今天的委託：選出「淺焙、日曬」咖啡豆，再沖出 1:15 的粉水比。')}</div>${btn('開始沖煮','next()','primary')}`;if(step===1)return `<div class="scene"><h3>階段 1／2 · 選豆</h3><div class="coffeegear"><div>🫘<span>咖啡豆</span></div><div>⚙️<span>磨豆機</span></div><div>⚖️<span>電子秤</span></div></div><p>三包咖啡豆，哪包符合委託？</p><div class="choices">${btn('A · 深焙／水洗',"coffeeBean('A')")}${btn('B · 淺焙／日曬',"coffeeBean('B')")}${btn('C · 中焙／蜜處理',"coffeeBean('C')")}</div>${hint('同時觀察焙度和處理法。','要選淺焙、日曬的那一包。')}</div>`;if(step===2)return `<div class="scene"><h3>階段 2／2 · 調整注水量</h3><p>你已稱取 <b>20 g</b> 咖啡粉，目標粉水比是 <b>1:15</b>。請調整注水量。</p><div class="coffeegear"><div>🫘<span>20 g 咖啡粉</span></div><div>💧<span id="waterLabel">250 mL 水</span></div><div>☕<span>V60 手沖</span></div></div><input aria-label="注水量" class="range" type="range" min="200" max="400" step="10" value="250" oninput="document.getElementById('waterLabel').textContent=this.value+' mL 水';temp.water=+this.value"><p>${btn('開始注水','coffeePour()','primary')}</p>${hint('粉水比 1:15 代表每 1 g 咖啡粉使用 15 g 水。','20 × 15 = 300，這裡簡化為 300 mL 水。')}</div>`;return success('☕','風味校正完成','手沖機器人終於承認：原來咖啡不是越苦越高級。','咖啡核心','日','coffee','咖啡大師')}
function coffeeBean(x){if(x==='B'){toast('選豆正確！磨豆機啟動。');next()}else toast('機器人：這包喝起來像星期一早上。再選一次！')}function coffeePour(){if((temp.water||250)===300){step=3;finish('coffee','光','咖啡大師')}else toast('比例還不對。電子秤正在用沉默表達失望。')}
const rhythm=[0,1,1,0,1];function music(){if(step===0)return `<div class="scene"><div class="big">🎙️</div><h3>演唱會：失聲事件</h3><p>舞台控制台遺失節奏資料。資料夾裡有三個標籤：《海闊天空》、JJ 音樂庫，以及一份標示「千萬別點」的舊檔案。</p><div class="choices">${btn('📁 千萬別點',"award('細節偵探');toast('系統：警告！發現封存的《小薇》與《缺口》黑歷史！')")}</div>${panel('主線任務：先看懂節奏圖例，再按順序輸入。這是原創節奏關卡，不需要聽商業歌曲。')}</div>${btn('進入舞台','next()','primary')}`;if(step===1)return `<div class="scene"><h3>階段 1／2 · 節奏密碼</h3><p>控制台記錄：<b>短・長・長・短・長</b>。請依照順序點擊下面兩個節奏鍵。</p><div class="keys">${btn('♪ 短',"musicTap(0)")}${btn('♫ 長',"musicTap(1)")}</div><p class="small">輸入進度：<span class="num" id="beat">${(temp.beats||[]).length} / 5</span></p><div class="meter"><div style="width:${(temp.beats||[]).length/5*100}%"></div></div>${hint('這是一個照圖例輸入的節奏序列。','短、長、長、短、長。')}</div>`;if(step===2)return `<div class="scene"><h3>階段 2／2 · 舞台調音</h3><p>三個音響頻道的狀態顯示：</p>${panel('A：正常　／　B：靜音　／　C：正常')}<p>選擇需要重新開啟的頻道，讓演唱會恢復聲音。</p><div class="choices">${btn('頻道 A',"musicChannel('A')")}${btn('頻道 B',"musicChannel('B')")}${btn('頻道 C',"musicChannel('C')")}</div></div>`;return success('🎤','舞台重新亮起','最後一束追光照向舞台中央。系統悄悄留下了一句話：「你唱歌的樣子，真的很好聽。」','音樂核心','快','music','舞台之星')}
function tone(long){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=long?523:784;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+(long?.34:.12));o.onended=()=>a.close()}catch(e){}}function musicTap(x){tone(x);temp.beats=temp.beats||[];if(rhythm[temp.beats.length]===x){temp.beats.push(x);if(temp.beats.length===5){toast('節奏同步成功！');next()}else render()}else{temp.beats=[];toast('節奏錯誤！重新從第一拍開始。');render()}}function musicChannel(x){if(x==='B'){step=3;finish('music','日','舞台之星')}else toast('這個頻道本來就是正常的，再看一次狀態。')}
function travel(){if(step===0)return `<div class="scene"><div class="big">🧭</div><h3>遺失的旅行座標</h3><p>導航系統把「曾經抵達的地方」和「最想前往的地方」混在一起。請翻找三份旅行檔案，重建路線。</p><p class="small">這章採用探索與蒐證玩法。先蒐集兩個座標標記，才能開啟最後目的地。</p></div>${btn('打開旅行地圖','next()','primary')}`;if(step===1)return `<div class="scene"><h3>探索旅行檔案</h3><div class="map"><button onclick="travelPlace('tanzania')"><span class="emoji">🦓</span>坦尚尼亞<br><small>動物大遷徙</small></button><button onclick="travelPlace('europe')"><span class="emoji">🏰</span>歐洲<br><small>城市與古堡</small></button><button onclick="travelPlace('nz')"><span class="emoji">🏔️</span>紐西蘭<br><small>未來旅行清單</small></button><button onclick="travelPlace('case')"><span class="emoji">🧳</span>神秘行李箱<br><small>需要調查</small></button></div><p>目前取得：<span class="num">${(temp.clues||[]).length} / 2</span> 枚座標標記</p><div class="inventory">${(temp.clues||[]).map(x=>`<span class="token">${x}</span>`).join('')}</div>${(temp.clues||[]).length>=2?btn('解鎖最後目的地','next()','primary'):panel('旅行檔案提示：從「親眼看過的奇景」和「最嚮往的風景」各找一枚標記。')}</div>`;if(step===2)return `<div class="scene"><h3>目的地確認</h3><p>旅行資料庫恢復了兩段重要紀錄：</p><p>🦓 曾經看過的壯觀動物大遷徙</p><p>🏔️ 現在最想親自探索的自然風景</p><p>哪個國家是這趟未完成旅行的下一站？</p><div class="choices">${btn('加拿大',"travelAnswer('canada')")}${btn('紐西蘭',"travelAnswer('nz')")}${btn('日本',"travelAnswer('japan')")}</div>${hint('想想他現在最嚮往的目的地。','答案是紐西蘭。')}</div>`;return success('🌍','導航恢復正常','從坦尚尼亞的草原，到尚未出發的紐西蘭。冒險永遠有下一站。','旅行核心','樂','travel','世界旅人')}
function travelPlace(x){if(x==='case'){award('空投獵人');toast('📦 行李箱裡居然是 PUBG 空投箱！裡面只有一張「今晚吃雞？」的紙條。');return}if(x==='europe'){toast('找到一張歐洲明信片。漂亮，但不是這次的關鍵座標。');return}let label=x==='tanzania'?'草原標記':'山脈標記';temp.clues=temp.clues||[];if(!temp.clues.includes(label))temp.clues.push(label);toast(x==='tanzania'?'🦓 已記錄坦尚尼亞動物大遷徙！':'🏔️ 已記錄紐西蘭的夢想座標！');render()}function travelAnswer(x){if(x==='nz'){step=3;finish('travel','樂','世界旅人')}else toast('導航 AI：你確定嗎？再檢查旅行檔案。')}
function electric(){if(step===0)return `<div class="scene"><div class="big">⚡</div><h3>失控的馬達控制中心</h3><p>一座虛構的低壓模擬馬達控制台突然停止運作。AI 助手已經連續喊了 27 次「要爆炸了！」，但你懷疑它只是太緊張。</p>${panel('這是遊戲用的簡化邏輯模擬，不代表實際馬達、變頻器或逆變器的安全操作程序。')}</div>${btn('進入模擬控制台','next()','primary')}`;if(step===1)return `<div class="scene"><h3>階段 1／2 · 檢查控制條件</h3><div class="circuit"><span>🔋 電源<br><small class="ok">正常</small></span><span class="wire"></span><span>🧠 控制器<br><small class="bad">待命</small></span><span class="wire"></span><span>⚙️ 馬達<br><small class="bad">未啟動</small></span></div><p>模擬系統的啟動條件寫著：<b>電源正常、控制器啟用、保護狀態正常</b>。目前電源與保護狀態正常，控制器仍待命。下一步應該處理哪個條件？</p><div class="choices">${btn('檢查控制器啟用狀態',"electricFix('controller')")}${btn('換一顆更大的馬達',"electricFix('motor')")}${btn('關閉所有警報',"electricFix('alarm')")}</div>${hint('看清楚哪些條件已滿足，哪個還沒滿足。','控制器仍在待命。')}</div>`;if(step===2)return `<div class="scene"><h3>階段 2／2 · 讀取狀態</h3><div class="circuit"><span>🔋 正常</span><span class="wire"></span><span>🧠 已啟用</span><span class="wire"></span><span>⚙️ 轉速：0</span></div><p>模擬紀錄顯示：<b>轉速指令 = 0</b>、<b>控制器狀態 = 已啟用</b>。若要讓模擬馬達開始轉動，應該先修改哪一項？</p><div class="choices">${btn('將轉速指令設為非零',"electricRun('speed')")}${btn('把警報音量調大',"electricRun('sound')")}${btn('拔掉顯示器',"electricRun('screen')")}</div></div>`;return success('⚡','系統恢復供電','馬達平穩轉動。AI 助手終於承認：「好吧，這次真的沒有爆炸。」','電力核心','星','electric','電力專家')}
function electricFix(x){if(x==='controller'){toast('控制器狀態已更新。');next()}else toast('系統：這個操作沒有解決目前的待命狀態。')}function electricRun(x){if(x==='speed'){step=3;finish('electric','快','電力專家')}else toast('AI 助手：這個操作很有創意，但轉速還是 0。')}
function success(emoji,title,desc,core,word,id,ach){return `<div class="scene" style="text-align:center"><div class="big">${emoji}</div><span class="pill">WORLD RESTORED</span><h2>${title}</h2><p>${desc}</p><div class="panel"><div class="small">已取得 ${core}</div><h2 style="color:var(--gold)">✦ ${word} ✦</h2><p class="small">請記住這個字。五個世界的字會在最終章派上用場。</p></div>${btn('返回中央控制室','goHome()','primary')} ${btn('重玩本章',`enter('${id}')`,'ghost')}</div>`}
function finale(){if(S.done.length!==5){goHome();return}if(S.final){app.innerHTML=ending();return}app.innerHTML=`<section class="fade"><span class="pill">FINAL MISSION · 5/5</span><h1>最後的系統指令</h1><div class="scene"><div class="big">🔐</div><p>五個世界的核心全部歸位。系統吐出五個字，但順序被打亂。</p><div class="inventory">${worlds.map(w=>`<span class="token">${w[1]} ${S.tokens[w[0]]}</span>`).join('')}</div><p>請依照 <b>足球 → 咖啡 → 音樂 → 旅行 → 電力</b> 的順序，把前四個字串成一句祝福；第五個字是額外的星星彩蛋。</p><input id="finalAnswer" type="text" placeholder="輸入五個字" autocomplete="off" maxlength="20"/><p>${btn('啟動生日檔案','checkFinal()','primary')}</p>${hint('五個字在各世界通關畫面都有出現。','依序是：生、日、快、樂、星。請輸入前四個字。')}</div>${btn('← 返回控制室','goHome()','ghost')}</section>`}
function checkFinal(){let x=(document.getElementById('finalAnswer').value||'').replace(/\s/g,'');if(x==='生日快樂'||x==='生日快樂星'){S.final=true;award('生日傳奇');save();render()}else toast('系統：訊息還沒解鎖。可以試著觀察每個世界的核心字。')}
function ending(){return `<section class="fade" style="text-align:center"><div class="hero"><div class="confetti">🎉 ✨ 🎂 ✨ 🎉</div><span class="pill">ALL SYSTEMS RESTORED</span><h1 style="color:var(--gold)">HAPPY BIRTHDAY!</h1><p class="lead" style="margin:auto">恭喜你完成所有任務，成功修復生日宇宙！</p></div><div class="panel"><h2>致最特別的 PLAYER ONE</h2><p>從足球場的最後一球，到咖啡香、舞台燈光、遙遠的旅行和熟悉的實驗室——</p><p>這些世界看起來毫不相關，卻有一個共同點：</p><h3 style="color:var(--mint)">它們都是你喜歡的事物，也是很特別的你。</h3><p>希望新的一歲，有更多精彩的比賽、好喝的咖啡、想唱就唱的歌，還有更多值得親眼看見的風景。</p><p>生日快樂！願你的每一個新關卡，都能玩得盡興。 ❤️</p><p class="small">— 一位偷偷策劃這場系統異常的人</p></div><div class="panel"><h3>🏅 玩家通關報告</h3><p>玩家：${esc(S.name)}　｜　修復世界：5 / 5　｜　解鎖成就：${S.ach.length} / 10</p><div class="inventory" style="justify-content:center">${S.ach.map(x=>`<span class="token">🏆 ${esc(x)}</span>`).join('')}</div></div><div class="row" style="justify-content:center">${btn('返回控制室','goHome()','primary')}${btn('重新觀看結局',"current='final';render()",'ghost')}</div></section>`}
render();
</script></body></html>
