function home(){cleanup();setMusicTheme("home");let worlds=[['soccer','⚽','足球決賽','抽卡・三場攻防賽'],['coffee','☕','手沖咖啡','三段式精準手沖'],['music','🎤','演唱會','節奏連擊・音效互動'],['travel','🌍','環球旅行','7×7 地圖尋寶'],['electric','⚡','馬達實驗室','電路邏輯推理']];app.innerHTML=head()+`<section class="panel center"><div style="font-size:56px">🎂🕹️✨</div><h1>生日宇宙大冒險</h1><p>警告！生日系統發生異常。<br>請完成五個不同的小遊戲，找回能量核心！<br><small>🎼 點上方「開啟音樂」聽每個世界的專屬原創配樂。</small></p><div class="progress">${worlds.map(w=>`<div class="dot ${S.done.includes(w[0])?'on':''}"></div>`).join('')}</div><p class="muted">五個世界可自由選擇，進度會保存在這個瀏覽器。</p></section><section class="worlds">${worlds.map(w=>`<div class="world ${S.done.includes(w[0])?'done':''}" onclick="${w[0]}()"><span class="emoji">${w[1]}</span><b>${w[2]}</b><div class="status">${S.done.includes(w[0])?'✓ 已完成':w[3]}</div></div>`).join('')}</section><section class="panel center"><h2>🎁 最終生日禮物</h2><p class="muted">${S.done.length===5?'所有核心已收集，生日禮物已解鎖！':'完成五個世界即可開啟'}</p><button class="btn alt" ${S.done.length!==5?'disabled':''} onclick="finale()">開啟最終檔案</button></section><div class="center"><button class="back" onclick="if(confirm('確定要清除全部遊戲進度嗎？')){localStorage.removeItem('playerone_cute_v1');S={...base,done:[],cards:[],ach:[]};home()}">重置遊戲進度</button></div>`}

let soccerRound=1;function soccer(){cleanup();soccerRound=1;if(!S.cards.length){pack();return}soccerPlan()}

function setTactic(t){soccerTactic=t;soccerStart()}
function soccerAdvance(){if(soccerRound>=3){done("soccer");return}soccerRound++;soccerPlan()}
function soccerStart(){cleanup();let good=soccerTactic===['bottom','top','mid'][soccerRound-1];frame('⚽ 第 '+soccerRound+'/3 場｜帶球突破','左手搖桿移動；右手「傳球」可以短暫牽制防守，「射門」需要在禁區內抓準移動球門的時機。被攔截 3 次就要重來。',`<canvas id="field" class="field" width="540" height="400"></canvas><div class="controls"><div id="joy" class="joystick"><div id="stick" class="stick"></div></div><div style="display:flex;gap:9px;align-items:center"><button id="pass" class="action" style="background:#80c8d8;box-shadow:0 5px 0 #5e9dab">↗<br>傳球</button><button id="shoot" class="action">⚽<br>射門</button></div></div><p class="center tiny" id="soccerInfo">被攔截 0/3 · 傳球可用</p><div class="center"><button class="btn soft" onclick="soccerPlan()">重新選戰術</button></div>`);
let cv=$('#field'),ctx=cv.getContext('2d'),joy=$('#joy'),stick=$('#stick'),kind=S.cards[S.selected||0]?.[3]||'finish';let st={x:55,y:good?([310,90,200][soccerRound-1]):200,dx:0,dy:0,def:[{x:260,y:good?100:220,v:good?1.1:2.2},{x:365,y:good?160:290,v:good?-1.2:-2.2},...(soccerRound===3?[{x:435,y:200,v:1.5}]:[])],hits:0,pass:0,passCooldown:0,goalY:200,goalDir:1,last:0};soccerState=st;
function setJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),max=38;if(m>max){x*=max/m;y*=max/m}st.dx=x/max;st.dy=y/max;stick.style.transform=`translate(${x}px,${y}px)`}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)};const reset=()=>{st.dx=0;st.dy=0;stick.style.transform=''};joy.onpointerup=reset;joy.onpointercancel=reset;
$('#pass').onclick=()=>{if(st.passCooldown>0){toast('傳球技能還在冷卻！');return}st.pass=110;st.passCooldown=300;toast('漂亮的傳球！防守暫時被吸引')};
$('#shoot').onclick=()=>{if(st.x<414){toast('要先帶球進入右側禁區！');return}let aim=Math.abs(st.y-st.goalY);let tolerance=kind==='finish'?44:29;if(aim<tolerance){cleanup();playEffect('win');frame('⚽ GOOOOAL！','戰術選擇、控球與射門時機都成功了！',`<div class="center"><div class="confetti">🏆⚽🎊</div><h2>第 ${soccerRound} 場勝利！</h2><p>${S.cards[S.selected||0][1]} 完成絕殺！</p><button class="btn" onclick="soccerAdvance()">${soccerRound<3?"前往下一場 →":"領取足球核心 💎"}</button></div>`)}else{st.x=355;toast('被門將撲出！調整位置再試一次')}};
function tick(){if(soccerState!==st)return;let speed=(kind==='speed'?4.3:3.2)-(soccerRound-1)*0.12;st.x=Math.max(20,Math.min(507,st.x+st.dx*speed));st.y=Math.max(25,Math.min(375,st.y+st.dy*speed));st.goalY+=st.goalDir*(1.8+soccerRound*.35);if(st.goalY>325||st.goalY<75)st.goalDir*=-1;if(st.pass>0)st.pass--;if(st.passCooldown>0)st.passCooldown--;for(let d of st.def){d.y+=d.v*(1+(soccerRound-1)*.20);if(d.y<45||d.y>355)d.v*=-1;if(st.pass===0&&Math.hypot(st.x-d.x,st.y-d.y)<32){st.hits++;st.x=55;st.y=good?([310,90,200][soccerRound-1]):200;$('#soccerInfo').textContent=`被攔截 ${st.hits}/3 · ${st.passCooldown?'傳球冷卻中':'傳球可用'}`;if(st.hits>=3){cleanup();frame('⚽ 比賽失利','防守太嚴密了！調整戰術或換個球員再挑戰。',`<div class="center"><div class="confetti">🥲⚽</div><button class="btn" onclick="soccerPlan()">再挑戰一次</button><button class="btn soft" onclick="chooseCard()">換球員</button></div>`);return}}}ctx.clearRect(0,0,540,400);ctx.fillStyle='#8bd2a1';ctx.fillRect(0,0,540,400);for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#ffffff12':'#ffffff26';ctx.fillRect(i*90,0,90,400)}ctx.strokeStyle='white';ctx.lineWidth=3;ctx.strokeRect(15,15,510,370);ctx.beginPath();ctx.moveTo(270,15);ctx.lineTo(270,385);ctx.stroke();ctx.beginPath();ctx.arc(270,200,55,0,7);ctx.stroke();ctx.strokeRect(410,90,112,220);ctx.fillStyle='#f9ebae';ctx.fillRect(523,st.goalY-42,15,84);ctx.fillStyle='#695d83';ctx.font='bold 15px system-ui';ctx.fillText('移動球門 ↕',412,35);ctx.font='29px system-ui';for(let d of st.def)ctx.fillText(st.pass?'😵':'🟥',d.x-15,d.y+10);ctx.fillText('🏃',st.x-16,st.y+7);ctx.font='18px system-ui';ctx.fillText('⚽',st.x+10,st.y+21);soccerLoop=requestAnimationFrame(tick)}tick()}
let coffeeState=null;
function coffee(){cleanup();coffeeState={bean:0,grind:5,water:0,phase:0,elapsed:0,flow:0,quality:0,stages:[],started:false};coffeeSetup()}
function coffeeSetup(){let c=coffeeState;frame('☕ 手沖實驗室｜神秘配方','讀取訂單後，選豆、磨豆，並分三次控制注水。不同階段有不同目標水量，不能一次倒完。',`<div class="panel" style="background:#fff8e7"><b>📜 客人的訂單</b><p>「想喝有明亮果香的淺焙日曬豆。使用 15g 咖啡粉、總注水量 240g，分三段注水：悶蒸 45g、第二段累積至 145g、最後累積至 240g。」</p><p class="muted">磨豆刻度 4–6 為這次的建議範圍。</p></div><div class="center"><p><b>豆子</b></p><button class="bean ${c.bean===0?'active':''}" onclick="coffeeState.bean=0;coffeeSetup()">🌸 淺焙日曬</button><button class="bean ${c.bean===1?'active':''}" onclick="coffeeState.bean=1;coffeeSetup()">🍫 深焙水洗</button><p><b>磨豆機刻度</b></p><input type="range" min="1" max="9" value="${c.grind}" id="grind" style="width:85%;accent-color:#9577d7"><p id="grindVal">${c.grind}</p><button class="btn" onclick="coffeeBrew()">開始沖煮 →</button></div>`);$('#grind').oninput=e=>{c.grind=+e.target.value;$('#grindVal').textContent=c.grind}}
function coffeeBrew(){let c=coffeeState;if(c.bean!==0||c.grind<4||c.grind>6){toast('先檢查客人要的豆子和研磨範圍！');return}frame('☕ 手沖實驗室｜分段注水','按住水壺開始注水，鬆開停止。三個階段都要控制精準，允許 ±7g 誤差。',`<div class="center"><h2 id="stage">第 1/3 段｜悶蒸</h2><div style="font-size:55px">🫖💧☕</div><div class="scale"><span id="grams">0</span> g</div><div class="meter"><div class="fill" id="waterfill"></div></div><p>這一段目標累積：<b id="target">45g</b></p><p class="tiny muted" id="flowHint">長按水壺，注意流速！</p><button id="pour" class="hold">🫖<br>按住倒水</button><p><button class="btn" onclick="coffeeNext()">完成本段 →</button> <button class="btn soft" onclick="coffee()">重新配方</button></p></div>`);let pour=$('#pour');function stop(){clearInterval(coffeeTimer);coffeeTimer=null}pour.onpointerdown=e=>{e.preventDefault();pour.setPointerCapture(e.pointerId);if(coffeeTimer)return;coffeeTimer=setInterval(()=>{c.water=Math.min(280,c.water+2);$('#grams').textContent=c.water;$('#waterfill').style.width=(c.water/240*100)+'%';if(c.water>=280)stop()},75)};pour.onpointerup=stop;pour.onpointercancel=stop}
function coffeeNext(){let c=coffeeState,targets=[45,145,240],goal=targets[c.phase];clearInterval(coffeeTimer);coffeeTimer=null;if(Math.abs(c.water-goal)>7){playEffect('miss');toast(c.water<goal?'注水還不夠，繼續！':'倒太多了！需要重新沖煮');if(c.water>goal+7)setTimeout(coffee,600);return}playEffect('hit');c.stages.push(c.water);c.phase++;if(c.phase===3){frame('☕ 完美的三段式手沖','你成功完成三次精準注水，萃取出明亮果香！',`<div class="center"><div class="confetti">☕🌸✨</div><h2>咖啡沖煮成功</h2><p>注水紀錄：${c.stages.join('g → ')}g</p><button class="btn" onclick="done('coffee')">領取咖啡核心 💎</button></div>`);return}$('#stage').textContent=`第 ${c.phase+1}/3 段｜${['悶蒸','第二段','最後一段'][c.phase]}`;$('#target').textContent=targets[c.phase]+'g';$('#flowHint').textContent='上一段完成！繼續按住水壺注水。';toast('✓ 精準完成上一段！')}
let musicTarget=[0,2,1,3,1,0,3,2,0,1,2,3], musicBpm=1;
function music(){cleanup();musicIntro()}

function musicStart(){cleanup();frame('🎤 演唱會｜節奏挑戰','在音符接近底部虛線時，點擊對應的四個按鈕。達成至少 9 次命中、失誤不超過 5 次。',`<div class="center"><h2 id="score">命中 0/12 · 失誤 0 · COMBO 0</h2></div><div class="notes">${[0,1,2,3].map(i=>`<div><div class="lane" id="lane${i}"><div class="hitline"></div></div><button class="pad" data-lane="${i}">${['🎵','🎶','⭐','💜'][i]}</button></div>`).join('')}</div><p class="center tiny muted">聽不到聲音也可以依照視覺節奏玩。</p><div class="center"><button class="btn soft" onclick="musicIntro()">重試</button></div>`);let st={index:0,hit:0,miss:0,combo:0,note:null,prev:performance.now()};musicState=st;function next(){if(st.index>=musicTarget.length){finish();return}st.note={lane:musicTarget[st.index],y:-30};st.index++}
function finish(){cleanup();if(st.hit>=9&&st.miss<=5){frame('🎤 演唱會復活！','舞台終於恢復聲音！',`<div class="center"><div class="confetti">🎤🎉🎶</div><h2>演出成功！</h2><p>命中 ${st.hit} / 12</p><p>彩蛋：海闊天空、缺口、小薇 🤭</p><button class="btn" onclick="done('music')">領取音樂核心 💎</button></div>`)}else frame('🎤 再練習一次','節奏有點亂了，試著看準虛線再按。',`<div class="center"><h2>命中 ${st.hit}/12</h2><p>失誤 ${st.miss} 次</p><button class="btn" onclick="musicStart()">重新演出</button></div>`)}
function updateScore(){$('#score').textContent=`命中 ${st.hit}/12 · 失誤 ${st.miss} · COMBO ${st.combo}`}
function hit(i){if(!st.note)return;if(i===st.note.lane&&st.note.y>=150&&st.note.y<=222){playEffect('hit');st.hit++;st.combo++;st.note=null;updateScore()}else{playEffect('miss');st.miss++;st.combo=0;updateScore();if(st.miss>5)finish()}}
document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>hit(+b.dataset.lane));function tick(now){if(musicState!==st)return;let dt=Math.min(50,now-st.prev);st.prev=now;if(!st.note)next();if(musicState!==st)return;st.note.y+=dt*0.14;for(let i=0;i<4;i++)$('#lane'+i).querySelectorAll('.fall').forEach(x=>x.remove());let d=document.createElement('div');d.className='fall';d.style.top=st.note.y+'px';$('#lane'+st.note.lane).appendChild(d);if(st.note.y>230){playEffect('miss');st.miss++;st.combo=0;st.note=null;updateScore();if(st.miss>5){finish();return}}musicLoop=requestAnimationFrame(tick)}musicLoop=requestAnimationFrame(tick)}
let travelState=null;

function drawTravel(){let s=travelState;frame('🌍 雙大陸探險｜失落的航線','先在坦尚尼亞草原找到獅子紀錄、地圖、相機與行李，再抵達紐西蘭。路上有不能穿越的樹叢。',`<div class="center"><p><b>收集 ${s.found.length}/4 件旅行紀念物</b> · 走了 ${s.steps} 步</p><div class="map" style="grid-template-columns:repeat(7,1fr);max-width:430px">${travelMap.flatMap((row,y)=>row.split('').map((cell,x)=>{let k=x+','+y,here=s.x===x&&s.y===y,item=travelThings[k];return `<div class="tile ${cell==='#'?'rock':''} ${here?'here':''} ${item==='🏔️'?'goal':''}" style="font-size:clamp(14px,4vw,24px)">${here?'🧑‍✈️':cell==='#'?'🌳':item&&(!s.found.includes(k)||item==='🏔️')?item:'·'}</div>`})).join('')}</div><div class="dpad"><span></span><button onclick="moveTravel(0,-1)">↑</button><span></span><button onclick="moveTravel(-1,0)">←</button><button onclick="moveTravel(0,1)">↓</button><button onclick="moveTravel(1,0)">→</button></div><p class="muted tiny">觀察路線，避免在樹叢間迷路。</p></div>`)}
function moveTravel(dx,dy){let s=travelState,x=s.x+dx,y=s.y+dy;if(x<0||x>=7||y<0||y>=7||travelMap[y][x]==='#'){toast('被樹叢擋住了！');return}s.x=x;s.y=y;s.steps++;let k=x+','+y;if(travelThings[k]&&travelThings[k]!=='🏔️'&&!s.found.includes(k)){playEffect('hit');s.found.push(k);toast('🎒 找到旅行紀念物！')}if(k==='6,6'){if(s.found.length===4){frame('🌍 旅行終點｜紐西蘭','草原的回憶，連接到未來想去的山海。',`<div class="center"><div class="confetti">🦁✈️🏔️</div><h2>探險完成！</h2><p>總步數：${s.steps}</p><button class="btn" onclick="done('travel')">領取旅行核心 💎</button></div>`);return}else toast('紀念物還沒全部收齊！')}drawTravel()}

function rotateWire(i){playEffect('tap');circuitState[i]=(circuitState[i]+1)%4;drawCircuit()}
function checkCircuit(){if(circuitState.every((v,i)=>v===circuitGoal[i]))frame('⚡ 馬達啟動成功！','所有控制模組都恢復正常。',`<div class="center"><div class="confetti">🌀⚡🎉</div><h2>系統已修復</h2><p>這次沒有任何東西爆炸！</p><button class="btn" onclick="done('electric')">領取電力核心 💎</button></div>`);else toast('方向還不對，重新看診斷紀錄！')}
function finale(){if(S.done.length!==5)return;cleanup();setMusicTheme('finale');playEffect('win');app.innerHTML=head()+`<section class="panel center"><div class="confetti">🎂🎊🏆</div><h1>MISSION COMPLETE!</h1><h2>生日快樂！</h2><p>恭喜最強玩家完成五個世界！</p><p>足球場上的關鍵一擊、咖啡實驗室的完美手沖、舞台上的旋律、遠方的冒險，以及馬達控制室——每個世界都不是隨機選的。</p><p><b>因為這些，都是你身上很特別的一部分。</b></p><p>希望新的一歲，還有好多想踢的比賽、想聽的歌、想喝的咖啡，以及想去的地方等著你。</p><div style="font-size:58px">💌</div><p><b>Happy Birthday, Player One!</b></p><p class="muted">— 來自為你偷偷設計這場冒險的人 ♡</p><button class="btn alt" onclick="home()">回到世界地圖</button></section>`}
