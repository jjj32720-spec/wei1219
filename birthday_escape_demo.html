function v107InitPan(){
 const view=document.getElementById('v107-viewport'),world=document.getElementById('v107-world'),thumb=document.getElementById('v107-thumb');if(!view||!world)return;
 let x=0,active=false,startX=0,origin=0,moved=false,pid=null,suppressClick=false;
 const extent=()=>Math.max(0,world.offsetWidth-view.clientWidth);
 const farScale=()=>Math.min(1,view.clientWidth/world.offsetWidth,view.clientHeight/world.offsetHeight);
 const render=()=>{
   const far=!room116Exploring;
   world.classList.toggle('room-v116-far',far);world.classList.toggle('room-v116-explore',!far);
   if(far){const z=farScale();x=(view.clientWidth-world.offsetWidth*z)/2;world.style.transform=`translate3d(${x}px,0,0) scale(${z})`;}
   else{x=Math.max(-extent(),Math.min(0,x));world.style.transform=`translate3d(${x}px,0,0) scale(1)`;}
   if(thumb){const pct=extent()?-x/extent():0;thumb.style.transform=`translateX(${Math.max(0,Math.min(1,pct))*212}%)`}
   requestAnimationFrame(positionLamp);
 };
 const lamp=document.createElement('button');lamp.type='button';lamp.className='room-v115-lamp';lamp.setAttribute('aria-label','切換房間燈光：全暗、全亮、微亮');view.appendChild(lamp);
 const positionLamp=()=>{if(!lamp.isConnected)return;const r=world.getBoundingClientRect(),v=view.getBoundingClientRect();lamp.style.left=(r.left-v.left+r.width*.515)+'px';lamp.style.top=(r.top-v.top+r.height*.085)+'px';};
 lamp.addEventListener('pointerdown',e=>e.stopPropagation());
 lamp.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();room113Open('light')});
 const narration=document.createElement('div');narration.className='room-v116-narration';narration.textContent='漆黑的房間裡……\n似乎有一盞燈，正等著你點亮。';narration.style.whiteSpace='pre-line';view.appendChild(narration);
 const hint=document.createElement('div');hint.className='room-v116-hint';hint.hidden=true;hint.textContent='👆 在房間裡快速點兩下，靠近探索';view.appendChild(hint);
 const updateUi=()=>{
  const dark=room114Light===0;
  narration.hidden=!dark;
  hint.hidden=dark||room116Exploring;
  const home=view.closest('.v104-home');home?.classList.toggle('room-v116-not-exploring',!room116Exploring);
  lamp.style.pointerEvents='auto';
  positionLamp();
 };
 window.room116OnLight=()=>{
  if(!view.isConnected)return;
  if(room114Light!==0)room116HasOpened=true;
  updateUi();
 };
 const zoomIn=()=>{
  if(room114Light===0||room116Exploring)return;
  room116Exploring=true;
  x=-extent()*.5;

 };
 let lastTap=0,lastTapX=0,lastTapY=0;
 view.addEventListener('pointerdown',e=>{
  if(e.target.closest('.room-v115-lamp')||e.target.closest('.room-v113-modal'))return;
  if(!room116Exploring)return;
  active=true;pid=e.pointerId;startX=e.clientX;origin=x;moved=false;
 },{passive:true});
 view.addEventListener('pointermove',e=>{
  if(!room116Exploring||!active||e.pointerId!==pid)return;
  const dx=e.clientX-startX;
  if(Math.abs(dx)>9&&!moved){moved=true;view.classList.add('is-dragging');try{view.setPointerCapture(pid)}catch(_){}}
  if(moved){x=origin+Math.max(-view.clientWidth*.48,Math.min(view.clientWidth*.48,dx));render()}
 },{passive:true});
 const end=e=>{if(!active||e.pointerId!==pid)return;active=false;view.classList.remove('is-dragging');if(moved){suppressClick=true;setTimeout(()=>suppressClick=false,180)}try{if(view.hasPointerCapture(pid))view.releasePointerCapture(pid)}catch(_){}};
 view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
 view.addEventListener('click',e=>{
  if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;return}
  if(!room116Exploring && room114Light!==0 && !e.target.closest('.room-v115-lamp')){
    e.preventDefault();e.stopImmediatePropagation();
    const now=Date.now();if(now-lastTap<520&&Math.abs(e.clientX-lastTapX)<75&&Math.abs(e.clientY-lastTapY)<75){zoomIn();lastTap=0}else{lastTap=now;lastTapX=e.clientX;lastTapY=e.clientY;}
  }
 },true);
 // iOS double-tap should not trigger browser zoom while inside the room.
 view.addEventListener('dblclick',e=>{if(!room116Exploring&&room114Light!==0){e.preventDefault();zoomIn()} });
 room116Exploring=room116HasOpened;
 if(room116Exploring)x=-extent()*.5;
 render();room114ApplyLight();updateUi();
 window.addEventListener('resize',()=>{if(document.getElementById('v107-world')===world)render()},{passive:true});
}

function performPass(e){
  if(e&&e.cancelable)e.preventDefault();
  if(st.paused||st.ended){message('請先繼續比賽');return}
  if(st.ballFlight){message('足球正在傳送中！');return}
  if(st.freeze>0){st.freeze=0}
  if(st.passLock>0){message('稍等隊友接球');return}
  let p=st.players[st.ball];
  let others=st.players.map((v,i)=>({v,i})).filter(v=>v.i!==st.ball);
  let target=others.sort((a,b)=>(Math.abs(b.v.x-p.x)+Math.abs(b.v.y-p.y)*.3)-(Math.abs(a.v.x-p.x)+Math.abs(a.v.y-p.y)*.3))[0];

  st.passes++;st.ballFlight={x:p.x,y:p.y,to:target.i,t:0};st.passLock=14;
  playEffect('tap');message('傳球 → '+soccerPlayers[target.v.id].name);
