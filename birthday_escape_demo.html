<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午夜檔案｜生日解謎</title><style>:root{color-scheme:dark;--bg:#0b1020;--panel:#151d30;--line:#34425c;--gold:#eac78d;--text:#f4f0e9;--muted:#aab7c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#273a55,#0b1020 65%);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:var(--text);min-height:100vh}main{max-width:690px;margin:auto;padding:35px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--gold);font-size:12px;letter-spacing:2px}.track{height:5px;background:#29354a;border-radius:10px;margin:18px 0 35px;overflow:hidden}.fill{height:100%;width:0;background:var(--gold);transition:width .4s}h1{font-size:clamp(28px,6vw,44px);line-height:1.3;letter-spacing:2px;margin:10px 0 18px}h2{font-size:24px}p{line-height:1.9;color:#d2d9e3}.card{background:linear-gradient(145deg,#1a263b,#11192b);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 18px 45px #0004}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold)}.puzzle{background:#0d1424;border:1px dashed #65718a;padding:22px;border-radius:12px;margin:23px 0;text-align:center}.digits{font-size:28px;letter-spacing:10px;color:var(--gold);font-weight:700}.letters{font-size:21px;letter-spacing:4px;color:var(--gold);font-weight:700}.note{font-size:13px;color:var(--muted)}button{background:var(--gold);border:0;border-radius:10px;padding:13px 19px;color:#192133;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--gold);border:1px solid #867354}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}input{width:100%;background:#0b1221;border:1px solid #61708a;border-radius:10px;padding:15px;color:white;font-size:18px;margin:8px 0 12px;text-align:center}input::placeholder{color:#8491a7}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.msg{min-height:25px;color:#ffb5aa;font-size:14px}.hidden{display:none}.hint{background:#222b40;border-left:3px solid var(--gold);padding:12px 15px;border-radius:6px;margin-top:15px;color:#eee}.objects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.obj{background:#26354a;color:white;border:1px solid #5e708c;min-height:75px}.obj.selected{background:#8a6b3e;color:white;border:2px solid #f8db9b}.footer{margin-top:28px;text-align:center;color:#7e8da5;font-size:12px}.stamp{display:inline-block;border:2px solid var(--gold);color:var(--gold);transform:rotate(-7deg);padding:8px 16px;letter-spacing:3px;margin:12px 0}.heart{font-size:48px}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:440px){.card{padding:20px}.digits{font-size:24px;letter-spacing:6px}.objects{gap:6px}.obj{padding:10px 4px;font-size:13px}}</style></head><body><main><div class="top"><span>ARCHIVE // 10.21</span><span id="status">檔案尚未開啟</span></div><div class="track"><div id="fill" class="fill"></div></div><section class="card fade" id="screen" aria-live="polite"></section><div class="footer">一份只為你存在的秘密檔案 · DEMO</div></main><script>
const screen=document.querySelector('#screen'),status=document.querySelector('#status'),fill=document.querySelector('#fill');let stage=Number(sessionStorage.getItem('birthdayStage')||0);if(!Number.isInteger(stage)||stage<0||stage>4)stage=0;let picks=[];
const scenes=[
`<div class="eyebrow">INCOMING TRANSMISSION</div><h1>午夜檔案</h1><p>你收到一封沒有寄件人的訊息。</p><div class="puzzle"><div class="stamp">TOP SECRET</div><p>「有一份專屬於你的檔案，被鎖在三道安全門之後。只有真正的主角，才有資格打開。」</p></div><p>準備好開始這場小小的冒險了嗎？</p><div class="actions"><button onclick="go(1)">接受任務 →</button></div>`,
`<div class="eyebrow">SECURITY GATE 01 / 03</div><h1>第一道門：數字的祕密</h1><p>監控畫面只留下四組數字。系統提示：<strong>「下一個數字，是前一個數字的兩倍。」</strong></p><div class="puzzle"><div class="digits">3 → 6 → 12 → ?</div></div><label for="answer">輸入缺少的數字</label><input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="輸入答案"><div class="actions"><button onclick="check(1)">解鎖</button><button class="secondary" onclick="hint(1)">需要提示？</button></div><div id="msg" class="msg" role="status"></div><div id="hint" class="hint hidden"></div>`,
`<div class="eyebrow">SECURITY GATE 02 / 03</div><h1>第二道門：失序的證物</h1><p>三件物品散落在桌上。依照下面的線索，<strong>由左到右</strong>選出正確順序。</p><div class="puzzle"><p>鑰匙不在最左邊。<br>星星緊挨著鑰匙左側。<br>月亮在星星左邊。</p></div><div class="objects"><button class="obj" onclick="pick('🌙',this)">🌙 月亮</button><button class="obj" onclick="pick('⭐',this)">⭐ 星星</button><button class="obj" onclick="pick('🗝️',this)">🗝️ 鑰匙</button></div><p class="note">已選順序：<span id="picked">尚未選擇</span></p><div class="actions"><button onclick="check(2)">確認順序</button><button class="secondary" onclick="resetPicks()">重選</button><button class="secondary" onclick="hint(2)">需要提示？</button></div><div id="msg" class="msg" role="status"></div><div id="hint" class="hint hidden"></div>`,
`<div class="eyebrow">SECURITY GATE 03 / 03</div><h1>第三道門：最後的暗號</h1><p>終端機顯示一張奇怪的字母卡片：</p><div class="puzzle"><div class="letters">C · B · D</div><p class="note">系統規則：每個字母都向前移動一格（B 會變 A）。</p></div><p>請輸入解密後的三個英文字母。</p><label for="answer">最後的密碼</label><input id="answer" type="text" autocapitalize="characters" autocomplete="off" placeholder="例如 ABC"><div class="actions"><button onclick="check(3)">開啟檔案</button><button class="secondary" onclick="hint(3)">需要提示？</button></div><div id="msg" class="msg" role="status"></div><div id="hint" class="hint hidden"></div>`,
`<div class="eyebrow">ARCHIVE UNLOCKED · 100%</div><h1>生日快樂！🎂</h1><div class="puzzle"><div class="heart">💌</div><div class="stamp">ACCESS GRANTED</div></div><p>恭喜你，成功破解所有關卡！</p><p>其實從一開始，就沒有什麼機密組織，也沒有真正失蹤的檔案。</p><p>只是有人想用一個有點麻煩、又有點可愛的方式，跟你說：</p><h2 style="color:var(--gold)">謝謝你來到這個世界。<br>也謝謝你出現在我的世界裡。</h2><p>希望你新的一歲，有很多值得期待的日子。生日快樂，我最喜歡的主角。❤️</p><p class="note">這是示範文字，之後可以替換成真正屬於你們的故事、照片與影片。</p><div class="actions"><button onclick="restart()">重新遊玩 ↻</button></div>`];
function render(){screen.classList.remove('fade');void screen.offsetWidth;screen.classList.add('fade');screen.innerHTML=scenes[stage];status.textContent=stage===0?'檔案尚未開啟':stage===4?'檔案已解鎖':`安全門 ${stage} / 3`;fill.style.width=(stage===4?100:stage/4*100)+'%';picks=[];if(stage===1||stage===3){const el=document.querySelector('#answer');el.addEventListener('keydown',e=>{if(e.key==='Enter')check(stage)})}}
function go(n){stage=n;sessionStorage.setItem('birthdayStage',String(stage));render();window.scrollTo({top:0,behavior:'smooth'})}
function check(n){const msg=document.querySelector('#msg');let ok=false;if(n===1)ok=document.querySelector('#answer').value.trim()==='24';if(n===2)ok=picks.join('')==='🌙⭐🗝️';if(n===3)ok=document.querySelector('#answer').value.trim().toUpperCase().replace(/\s/g,'')==='BAC';if(ok){msg.style.color='#a8e8c5';msg.textContent='驗證成功，正在開啟下一道門…';setTimeout(()=>go(n+1),650)}else{msg.style.color='#ffb5aa';msg.textContent=n===2?'順序不正確，再觀察線索試試。':'密碼不正確，再試一次。'}}
function hint(n){const h=document.querySelector('#hint');h.classList.remove('hidden');h.textContent=({1:'12 再乘以 2，會是多少？',2:'月亮必須在星星左邊，而星星又在鑰匙左邊。',3:'C 往前是 B；B 往前是 A；D 往前是 C。'})[n]}
function pick(emoji,el){if(picks.includes(emoji))return;picks.push(emoji);el.classList.add('selected');document.querySelector('#picked').textContent=picks.join(' → ')}
function resetPicks(){picks=[];document.querySelectorAll('.obj').forEach(el=>el.classList.remove('selected'));document.querySelector('#picked').textContent='尚未選擇';document.querySelector('#msg').textContent=''}
function restart(){go(0)}render();
</script></body></html>
