function roomEaster(el,kind){
 if(el.dataset.busy==='1')return;
 el.dataset.busy='1';
 try{playEffect('click')}catch(e){}
 const fx=el.parentElement.querySelector('.egg-'+kind+'-fx');
 if(fx){fx.classList.remove('show');void fx.offsetWidth;fx.classList.add('show')}
 if(kind==='frame'){const f=el.parentElement.querySelector('.egg-frame-fx');if(f)f.textContent='♡ ♡'}
 setTimeout(()=>{el.dataset.busy='0';if(fx)fx.classList.remove('show')},1400);
}
function v107InitPan(){
 const view=document.getElementById('v107-viewport'),world=document.getElementById('v107-world'),thumb=document.getElementById('v107-thumb');if(!view||!world)return;
 let x=0,active=false,startX=0,origin=0,moved=false,pid=null,suppressClick=false;
 const extent=()=>Math.max(0,world.offsetWidth-view.clientWidth);
 const render=()=>{x=Math.max(-extent(),Math.min(0,x));world.style.transform=`translate3d(${x}px,0,0)`;if(thumb){const pct=extent()?-x/extent():0;thumb.style.transform=`translateX(${pct*212}%)`}};
 const intro=document.createElement('div');intro.className='v109-intro';intro.innerHTML='<div class="v109-intro-hand">☝</div><div>左右滑動，探索房間</div><small>輕觸發光的物件，發現驚喜</small>';view.appendChild(intro);
 let dismissed=false;const dismiss=()=>{if(dismissed)return;dismissed=true;intro.classList.add('gone');setTimeout(()=>intro.remove(),500)};
 x=-extent()*.5;render();
 view.addEventListener('pointerdown',e=>{if(e.target.closest('.v107-ui button'))return;active=true;pid=e.pointerId;startX=e.clientX;origin=x;moved=false;},{passive:true});
 view.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const dx=e.clientX-startX;if(Math.abs(dx)>9&&!moved){moved=true;view.classList.add('is-dragging');dismiss();try{view.setPointerCapture(pid)}catch(_){}}if(moved){x=origin+Math.max(-view.clientWidth*.48,Math.min(view.clientWidth*.48,dx));render()}},{passive:true});
 const end=e=>{if(!active||e.pointerId!==pid)return;active=false;view.classList.remove('is-dragging');if(moved){suppressClick=true;setTimeout(()=>suppressClick=false,180)}try{if(view.hasPointerCapture(pid))view.releasePointerCapture(pid)}catch(_){}};
 view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
 view.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;return}if(e.target.closest('.v104-hit'))dismiss()},true);
 window.addEventListener('resize',()=>{if(document.getElementById('v107-world')===world)render()},{passive:true});
}

function ensureFootball(){
 if(!Array.isArray(S.footballOwned)){S.footballOwned=[0,1,2];S.footballPacks=1}
 S.footballOwned=[...new Set(S.footballOwned.filter(i=>Number.isInteger(i)&&i>=0&&i<soccerPlayers.length))];
 if(S.aceUnlocked&&!S.footballOwned.includes(5))S.footballOwned.push(5);
 if(!Array.isArray(S.footballSquad)||S.footballSquad.length!==3||S.footballSquad.some((id,i)=>!soccerPlayers[id]||soccerPlayers[id].role!==['ST','MID','DEF'][i]))S.footballSquad=[0,1,2];
 if(!Number.isFinite(S.footballPacks))S.footballPacks=0;
 // Existing saves from earlier versions may have no initial pack; grant once only.
 if(!S.packWelcomeChecked){if(S.footballPacks<=0&&S.footballOwned.filter(i=>i!==5).length<=3)S.footballPacks=1;S.packWelcomeChecked=true}
 save();
}

 const available=soccerPlayers.map((p,i)=>i).filter(i=>!soccerPlayers[i].secret&&!S.footballOwned.includes(i));
 if(!available.length){toast('公開球員已全數收集！');return}

 overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)soccerClosePack()});document.body.appendChild(overlay);
 const strip=overlay.querySelector('#v101-tear');let startX=null, pointerId=null, completed=false;
 function reset(){startX=null;pointerId=null;strip.style.setProperty('--tear-progress','0%');strip.classList.remove('v101-dragging')}
 strip.addEventListener('pointerdown',e=>{if(completed)return;const r=strip.getBoundingClientRect();if(e.clientX>r.left+r.width*.46){overlay.querySelector('#v101-instruction').textContent='從左邊開始，向右撕開卡包 ✨';return}e.preventDefault();startX=e.clientX;pointerId=e.pointerId;strip.setPointerCapture?.(e.pointerId);strip.classList.add('v101-dragging')});
 strip.addEventListener('pointermove',e=>{if(startX===null||e.pointerId!==pointerId)return;e.preventDefault();const r=strip.getBoundingClientRect(),fraction=Math.max(0,Math.min(1,(e.clientX-startX)/(r.width*.77)));strip.style.setProperty('--tear-progress',`${fraction*100}%`);if(fraction>=.94){completed=true;startX=null;reveal();}});
 strip.addEventListener('pointerup',e=>{if(!completed&&e.pointerId===pointerId)reset()});strip.addEventListener('pointercancel',reset);
 function reveal(){
  const remaining=soccerPlayers.map((p,i)=>i).filter(i=>!soccerPlayers[i].secret&&!S.footballOwned.includes(i));

  overlay.querySelector('#v101-envelope').classList.add('v101-opened');overlay.querySelector('#v101-instruction').hidden=true;
  overlay.querySelector('#v101-count').textContent=S.footballPacks;
  const result=overlay.querySelector('#v101-result');result.hidden=false;
  result.innerHTML=`<div class="v101-new">✦ NEW PLAYER UNLOCKED ✦</div><div class="v101-card"><div class="v101-card-top"><b>★ PLAYER ONE FC</b><span>${roleName}</span></div><div class="v101-avatar">${p.icon}</div><div class="v101-number">#${p.number}</div><div class="v101-name">${p.name}</div><div class="v101-role">${p.role} · ${roleName}</div><div class="v101-skill"><strong>${p.icon} ${p.skill}</strong><p>${p.skillDesc}</p></div><div class="v101-stats">${[['速度',p.pace],['射門',p.shot],['傳球',p.pass],['盤帶',p.dribble],['防守',p.defense],['體力',p.stamina]].map(([k,v])=>`<div class="v101-stat"><span>${k}</span><b>${v}</b><i style="--stat:${v}%"></i></div>`).join('')}</div></div><button type="button" class="v101-done" onclick="soccerClosePack()">收藏球員卡 ✓</button>`;
  playEffect('win');
 }
