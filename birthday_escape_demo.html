function v107InitPan(){
 const view=document.getElementById('v107-viewport'),world=document.getElementById('v107-world'),thumb=document.getElementById('v107-thumb');if(!view||!world)return;
 let x=0,active=false,startX=0,origin=0,moved=false,pid=null,blockClick=false;
 const extent=()=>Math.max(0,world.getBoundingClientRect().width-view.clientWidth);
 const render=()=>{x=Math.max(-extent(),Math.min(0,x));world.style.transform=`translate3d(${x}px,0,0)`;if(thumb)thumb.style.transform=`translateX(${extent()?(-x/extent())*212:0}%)`};
 x=-extent()*.36;render();
 view.addEventListener('pointerdown',e=>{active=true;pid=e.pointerId;startX=e.clientX;origin=x;moved=false;view.setPointerCapture(pid)},{passive:true});
 view.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const dx=e.clientX-startX;if(Math.abs(dx)>7){moved=true;view.classList.add('is-dragging')}if(moved){x=origin+dx;render()}},{passive:true});
 const end=e=>{if(!active||e.pointerId!==pid)return;active=false;view.classList.remove('is-dragging');if(moved){blockClick=true;setTimeout(()=>blockClick=false,350)}try{view.releasePointerCapture(pid)}catch(_){}};
 view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
 view.addEventListener('click',e=>{if(blockClick){e.preventDefault();e.stopPropagation();blockClick=false}},true);
 // Swipe on empty space; tapping an object still enters its game.
 view.addEventListener('touchstart',e=>{}, {passive:true});
 window.addEventListener('resize',()=>{if(document.getElementById('v107-world')===world)render()},{passive:true});
}
function v104Enter(el,target){if(el.dataset.opening)return;el.dataset.opening='1';el.classList.add('v104-open');playEffect('click');setTimeout(()=>{if(typeof window[target]==='function')window[target]();else ({musicIntro,travel,soccer,coffee,electric})[target]?.()},430)}
